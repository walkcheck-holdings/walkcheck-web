<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagar factura · WalkCheck</title>
<meta name="robots" content="noindex">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #F5F8FC; color: #13243A; }
  header { background: #0E2A47; color: #fff; padding: 14px 16px; font-weight: 800; }
  header small { font-size: 10px; letter-spacing: .18em; opacity: .8; }
  .card { max-width: 460px; margin: 40px auto; background: #fff; border-radius: 16px; padding: 28px 22px; text-align: center; box-shadow: 0 10px 30px rgba(14,42,71,.08); }
  .icon { font-size: 44px; }
  h1 { font-size: 22px; margin: 10px 0 6px; }
  p { color: #5F7189; line-height: 1.5; }
  .btn { display: inline-block; background: #16A34A; color: #fff; text-decoration: none; font-weight: 800; padding: 14px 26px; border-radius: 12px; margin-top: 10px; font-size: 16px; border: 0; cursor: pointer; }
  .muted { font-size: 13px; color: #8A97A8; margin-top: 18px; }
  .lang { position: absolute; right: 16px; top: 12px; color: #fff; font-size: 13px; text-decoration: none; border: 1px solid rgba(255,255,255,.4); border-radius: 8px; padding: 3px 9px; }
</style>
</head>
<body>
<header style="position:relative">WalkCheck <small>HOLDINGS LLC</small><a class="lang" href="#" id="lang">English</a></header>
<!-- Client side of "Pagar en línea": the link in the invoice email lands here.
     The card is entered on Stripe's secure page; the money goes to the company
     that sent the invoice. -->
<div class="card">
  <div class="icon" id="ic">💳</div>
  <h1 id="t"></h1>
  <p id="s"></p>
  <div id="go"></div>
  <p class="muted" id="m"></p>
</div>
<script>
var q = new URLSearchParams(location.search);
// Language of the invoice (from the link); else the browser's.
var en = q.get('lang') ? q.get('lang') === 'en' : (navigator.language || '').toLowerCase().indexOf('es') !== 0;
var c = q.get('c') || '', i = q.get('i') || '', t = q.get('t') || '', estado = q.get('estado') || '';
var FN = 'https://us-central1-walkcheck-a4f1e.cloudfunctions.net/payInvoice';
function T(es, eng) { return en ? eng : es; }
function render() {
  document.getElementById('lang').textContent = en ? 'Español' : 'English';
  var ic = '💳', title, sub, btn = '';
  var payHref = FN + '?c=' + encodeURIComponent(c) + '&i=' + encodeURIComponent(i) + '&t=' + encodeURIComponent(t) + '&lang=' + (en ? 'en' : 'es');
  if (estado === 'gracias') { ic = '✅'; title = T('¡Pago recibido!', 'Payment received!'); sub = T('Gracias. La compañía ya ve su factura como pagada. Stripe le enviará el recibo a su correo.', 'Thank you. The company now sees your invoice as paid. Stripe will email you the receipt.'); }
  else if (estado === 'pagada') { ic = '✅'; title = T('Esta factura ya está pagada', 'This invoice is already paid'); sub = T('No hay nada pendiente.', 'Nothing is due.'); }
  else if (estado === 'cancelado') { ic = '↩️'; title = T('Pago cancelado', 'Payment canceled'); sub = T('No se cobró nada. Puede intentarlo otra vez cuando quiera.', 'Nothing was charged. You can try again anytime.'); if (c && i && t) btn = '<a class="btn" href="' + payHref + '">' + T('Intentar de nuevo', 'Try again') + '</a>'; }
  else if (estado === 'no-disponible') { ic = 'ℹ️'; title = T('Pago en línea no disponible', 'Online payment not available'); sub = T('Esta compañía todavía no acepta pagos con tarjeta. Comuníquese con ella para pagar.', 'This company does not take card payments yet. Please contact them to pay.'); }
  else if (estado === 'enlace') { ic = '⚠️'; title = T('Enlace no válido', 'Invalid link'); sub = T('Use el enlace del correo más reciente de la factura o pida uno nuevo a la compañía.', 'Use the link from the latest invoice email or ask the company for a new one.'); }
  else if (estado === 'error') { ic = '⚠️'; title = T('No se pudo abrir el pago', 'Could not open the payment'); sub = T('Inténtelo de nuevo en un momento.', 'Please try again in a moment.'); if (c && i && t) btn = '<a class="btn" href="' + payHref + '">' + T('Intentar de nuevo', 'Try again') + '</a>'; }
  else if (c && i && t) { title = T('Pagar su factura', 'Pay your invoice'); sub = T('Pagará con tarjeta en la página segura de Stripe. El pago va directo a la compañía que le envió la factura.', 'You will pay by card on Stripe\'s secure page. The payment goes straight to the company that sent the invoice.'); btn = '<a class="btn" href="' + payHref + '">' + T('Pagar con tarjeta', 'Pay by card') + '</a>'; }
  else { ic = '⚠️'; title = T('Enlace incompleto', 'Incomplete link'); sub = T('Abra el enlace "Pagar en línea" desde el correo de la factura.', 'Open the "Pay online" link from the invoice email.'); }
  document.getElementById('ic').textContent = ic;
  document.getElementById('t').textContent = title;
  document.getElementById('s').textContent = sub;
  document.getElementById('go').innerHTML = btn;
  document.getElementById('m').textContent = T('Pagos procesados por Stripe · WalkCheck Holdings LLC', 'Payments processed by Stripe · WalkCheck Holdings LLC');
}
document.getElementById('lang').onclick = function (e) { e.preventDefault(); en = !en; render(); };
render();
</script>
</body>
</html>
