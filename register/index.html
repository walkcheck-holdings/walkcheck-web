<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walkcheck · Registro</title>
<!-- pay-door 7033576 -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="/js/jobTemplates.js"></script>
<script src="/js/paymentLinks.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; margin: 0; background: #F2F2F7; color: #111; }
  header { background: #34C759; color: #fff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { margin: 0; font-size: 18px; }
  header a { color: #fff; text-decoration: none; font-weight: 700; }
  .card { max-width: 420px; margin: 32px auto; background: #fff; padding: 20px; border-radius: 12px; }
  label { font-size: 13px; font-weight: 700; color: #6B7280; display: block; margin-top: 8px; }
  input, select { width: 100%; padding: 10px 12px; margin: 6px 0 10px; border: 1px solid #D1D1D6; border-radius: 10px; font-size: 14px; }
  .btn { background: #34C759; color: #fff; border: none; padding: 12px 16px; border-radius: 10px; font-size: 14px; cursor: pointer; width: 100%; min-height: 44px; font-weight: 700; }
  .err { color: #b3261e; font-size: 14px; margin-top: 8px; }
  .muted { color: #8E8E93; font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>Walkcheck</h1>
  <a href="/app/">Entrar</a>
</header>
<div class="card">
  <h2>Crear mi cuenta</h2>
  <p class="muted">15 días gratis. Planes: CREW 5 $99.99 · CREW 10 $149.99 · UNLIMITED $299.99. Al crear la cuenta te llevamos a Stripe a activar ese plan.</p>
  <label>Plan</label>
  <select id="plan">
    <option value="crew5">CREW 5 $99.99</option>
    <option value="crew10">CREW 10 $149.99</option>
    <option value="unlimited">UNLIMITED $299.99</option>
  </select>
  <label>Nombre de la compañía</label>
  <input id="name" type="text" required>
  <label>Tu nombre</label>
  <input id="fullName" type="text" required>
  <label>Correo</label>
  <input id="email" type="email" required>
  <label>Contraseña</label>
  <input id="password" type="password" minlength="6" required>
  <label>Tipo de compañía *</label>
  <select id="companyType" required>
    <option value="">Selecciona…</option>
  </select>
  <button class="btn" id="go" style="font-size:18px;min-height:56px">Crear mi cuenta - 15 dias gratis</button>
  <div class="err" id="err"></div>
  <p class="muted">¿Ya tienes cuenta? <a href="/app/">Entrar al panel</a></p>
  <p class="muted">¿Dudas? Escríbenos a <a href="mailto:soporte@walkcheck.app">soporte@walkcheck.app</a></p>
</div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAnAsnPirqkN-fRIx-9aQzuwLBoFaHggrU",
  authDomain: "walkcheck-a4f1e.firebaseapp.com",
  projectId: "walkcheck-a4f1e",
  storageBucket: "walkcheck-a4f1e.firebasestorage.app",
  messagingSenderId: "827762473021",
  appId: "1:827762473021:web:ff71afbe72df3a96ad5254"
};
firebase.initializeApp(firebaseConfig);
const planSel = document.getElementById('plan');
if (typeof fillPlanSelect === 'function') fillPlanSelect(planSel);
const fromUrl = (typeof normalizePlan === 'function' ? normalizePlan(new URLSearchParams(location.search).get('plan')) : '') || '';
if (fromUrl) planSel.value = fromUrl;
const sel = document.getElementById('companyType');
(window.COMPANY_TYPE_OPTIONS||[]).forEach(o => {
  const opt = document.createElement('option');
  opt.value = o.id; opt.textContent = o.label; sel.appendChild(opt);
});
document.getElementById('go').onclick = async () => {
  const err = document.getElementById('err');
  err.textContent = '';
  const name = document.getElementById('name').value.trim();
  const fullName = document.getElementById('fullName').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const companyType = sel.value;
  if (!name || !fullName || !email || !password || !companyType) {
    err.textContent = 'Completa todos los campos, incluido Tipo de compañía.';
    return;
  }
  try {
    const cred = await firebase.auth().createUserWithEmailAndPassword(email, password);
    const uid = cred.user.uid;
    const db = firebase.firestore();
    const ref = db.collection('companies').doc();
    const label = (window.COMPANY_TYPE_OPTIONS||[]).find(o => o.id===companyType)?.label || companyType;
    const plan = normalizePlan(planSel.value) || fromUrl || 'crew10';
    const trialEnds = firebase.firestore.Timestamp.fromDate(new Date(Date.now() + 15*24*60*60*1000));
    await ref.set({
      id: ref.id, name, companyType, industry: label, panel: 'walkcheck', plan,
      status: 'active', adminUid: uid,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      trial_start: firebase.firestore.FieldValue.serverTimestamp(),
      trial_end: trialEnds,
      trialEnds,
      is_paid: false
    });
    await db.collection('users').doc(uid).set({
      uid, companyId: ref.id, displayName: fullName, role: 'owner',
      email: email.toLowerCase(),
      companyType, username: email.split('@')[0],
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    await ref.collection('members').doc(uid).set({
      uid, role: 'owner', email: email.toLowerCase(), displayName: fullName
    }, { merge: true });
    try {
      await db.collection('mail').add({
        to: [email],
        message: {
          subject: 'Tienes 15 dias gratis para probar WalkCheck',
          text: 'Hola ' + fullName + ',\n\nTienes 15 dias gratis para probar WalkCheck.\n\nEntra: https://walkcheck.app/app/\n',
          html: '<p>Hola ' + fullName + ',</p><p><b>Tienes 15 dias gratis para probar WalkCheck</b>.</p><p><a href="https://walkcheck.app/app/">Entrar al panel</a></p>'
        }
      });
    } catch(_){}
    const FALLBACK = {
      crew5: 'https://buy.stripe.com/00w8wP5Lo5qt3Ul3iO63K00',
      crew10: 'https://buy.stripe.com/dRm9AT7Twf134YpbPk63K01',
      unlimited: 'https://buy.stripe.com/3cI00jgq22eh1Md7z463K02'
    };
    let pay = '';
    try {
      if (typeof paymentHref === 'function') pay = paymentHref(plan, { email: email, clientRef: ref.id });
    } catch (_) {}
    if (!pay) {
      const base = FALLBACK[plan] || FALLBACK.crew10;
      pay = base + '?prefilled_email=' + encodeURIComponent(email) + '&client_reference_id=' + encodeURIComponent(ref.id);
    }
    location.replace(pay);
  } catch (e) {
    err.textContent = e.message || 'No se pudo registrar.';
  }
};
</script>
</body>
</html>
