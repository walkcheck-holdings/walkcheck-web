<script>

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const $ = id => document.getElementById(id);
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const SLOT = 90;
let START = 6;
function dayHours(){
  let minH = 6, maxH = 20;
  jobs.filter(jobDayOk).forEach(j => {
    const st = jobTime(j);
    const en = jobEnd(j, st);
    minH = Math.min(minH, st.getHours());
    maxH = Math.max(maxH, en.getHours(), st.getHours());
  });
  if (preHour != null) { minH = Math.min(minH, preHour); maxH = Math.max(maxH, preHour+1); }
  const arr = [];
  for (let h = minH; h <= maxH; h++) arr.push(h);
  return arr;
}

let profile = { role: 'worker', companyId: '', displayName: '' };
let buildings = [];
let techs = [];
let jobs = [];
let selectedDay = new Date();
let bFilter = 'All';
let bQuery = '';
let selectedBuilding = '';

function isPhone(){ return window.matchMedia('(max-width: 1023px)').matches; }
function useDesk(){ return !isPhone() || forceDesktop; }
function pack(){
  const t = window.JOB_TEMPLATES || {};
  return t[companyType] || t.property_management || {sitesLabel:'Buildings', searchPlaceholder:'Search buildings...', jobs:['INSPECTION']};

    hvac: 'Panel HVAC',
    roofing: 'Panel Roofing',

    property_management: 'Panel Inspecciones'
  })[companyType] || 'Walkcheck · Panel';
}

  document.body.dataset.panel = companyType;
  const h = document.querySelector('header h1 a');

function isSuper(){
  return (auth.currentUser && auth.currentUser.email || '').toLowerCase() === 'maikelramirez55@gmail.com';
}
function isBoss(){
  if (isSuper()) return true;
  return ['owner','admin','manager','supervisor','editor'].includes(String(profile.role||'').toLowerCase());
}
function canAssign(){
  return ['owner','admin','manager','supervisor'].includes(String(profile.role||'').toLowerCase())
    || isSuper();
}
let companyAdminUid = '';
function canManageTypes(){
  const r = String(profile.role||'').toLowerCase();
  const uid = auth.currentUser && auth.currentUser.uid;
  return isSuper() || r === 'owner' || r === 'admin' || (uid && companyAdminUid === uid);
}
async function resolveTypeAdmin(uid){
  try {
    const co = await db.collection('companies').doc(cid()).get();
    companyAdminUid = (co.exists && co.data().adminUid) || '';
  } catch(_) { companyAdminUid = ''; }
  if (canManageTypes()) return;
  try {
    const m = await db.collection('companies').doc(cid()).collection('members').doc(uid).get();
    const mr = String((m.exists && m.data().role) || '').toLowerCase();
    if (mr === 'owner' || mr === 'admin') profile.role = mr;
  } catch(_){}
}
function slugify(n){
  return String(n||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
}
function defaultTypes(){
  return pack().jobs.map(n => ({
    name: n, slug: slugify(n), icon: '🔧', color: '#34C759',
    descriptionTemplate: '', category: companyType, custom: false
  }));
}
function allTypes(activeOnly){
  const defs = defaultTypes();
  const extra = customTypes.filter(t => !activeOnly || t.isActive !== false);
  const names = new Set(defs.map(d => d.name.toLowerCase()));
  extra.forEach(t => { if (!names.has(String(t.name||'').toLowerCase())) defs.push({...t, custom:true}); });
  return defs;
}
function typeOf(kind){
  const k = String(kind||'').toLowerCase();
  return allTypes(false).find(t => String(t.name).toLowerCase()===k || t.slug===k) || { color:'#34C759', icon:'🔧', name: kind||'Job' };
}
function cid(){
  if (isSuper() && viewCid) return viewCid;
  return profile.companyId || '';
}
function ymd(d){
  const x = d instanceof Date ? d : new Date(d);
  return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
}
function canSeeMoney(){
  const r = String(profile.role||'').toLowerCase();
  if (r !== 'owner' && r !== 'admin' && !isCompanyCreatorLike()) return false;
  if (isSuper() && cid() && cid() !== profile.companyId) return false;
  return !!cid();
}
function isCompanyCreatorLike(){
  const uid = auth.currentUser && auth.currentUser.uid;
  return !!(uid && companyAdminUid && uid === companyAdminUid && cid() === profile.companyId);
}
async function enforceTrial(){
  if (isSuper()) return true;
  try {
    const co = await db.collection('companies').doc(cid()).get();
    const d = co.data() || {};
    if (d.is_paid === true) return true;
    const raw = d.trialEnds || d.trial_end;
    let end = null;
    if (raw && raw.toDate) end = raw.toDate();
    else if (typeof raw === 'string') end = new Date(raw);
    if (!end || isNaN(end.getTime())) return true;
    if (Date.now() < end.getTime()) return true;
    location.href = '/pricing/';
    return false;
  } catch(_) { return true; }
}

function weekStart(d){

}
function sameDay(a,b){

}

function clockToDate(clock, day){
  const d = day || selectedDay;
  const p = String(clock||'').split(':');
  const h = parseInt(p[0],10);
  const m = parseInt(p[1],10);
  if (isNaN(h) || isNaN(m)) return null;
  return new Date(d.getFullYear(), d.getMonth(), d.getDate(), h, m, 0, 0);
}
function toClock(d){
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function parseLooseTime(raw, day){
  const d = day || selectedDay;
  const s = String(raw||'').toUpperCase().replace('.',':').trim();
  const num = s.replace(/[^0-9:]/g,'');
  let h=9, m=0;
  if (/^\d{1,2}$/.test(num)) h = parseInt(num,10);
  else if (num.includes(':')) { const p=num.split(':'); h=parseInt(p[0],10)||9; m=parseInt(p[1],10)||0; }
  if (s.includes('PM') && h<12) h+=12;
  if (s.includes('AM') && h===12) h=0;
  return new Date(d.getFullYear(), d.getMonth(), d.getDate(), h, m, 0, 0);
}
function jobTime(j){
  const d = selectedDay;
  const fromClock = clockToDate(j.startClock || j.startHHMM, d);
  if (fromClock) return fromClock;
  if (typeof j.hour === 'number') {
    return new Date(d.getFullYear(), d.getMonth(), d.getDate(), j.hour, j.minute||0);
  }
  const t = j.appointment_start || j.appointmentStart;
  if (t && t.toDate) {
    const x = t.toDate();
    return new Date(d.getFullYear(), d.getMonth(), d.getDate(), x.getHours(), x.getMinutes());
  }
  return parseLooseTime(j.time || j.startTime, d);
}
function jobEnd(j, start){
  const fromClock = clockToDate(j.endClock || j.endHHMM, selectedDay);
  if (fromClock) return fromClock;
  if (typeof j.endHour === 'number') {
    return new Date(selectedDay.getFullYear(), selectedDay.getMonth(), selectedDay.getDate(), j.endHour, j.endMinute||0);
  }
  const t = j.appointment_end || j.appointmentEnd;
  if (t && t.toDate) {
    const x = t.toDate();
    return new Date(selectedDay.getFullYear(), selectedDay.getMonth(), selectedDay.getDate(), x.getHours(), x.getMinutes());
  }
  if (j.endTime) {
    const e = parseLooseTime(j.endTime, selectedDay);
    if (e > start) return e;
  }
  return new Date(start.getTime()+60*60*1000);
}
function jobsForTech(t){
  return jobs.filter(j => jobDayOk(j) && (assignedOf(j)===t.uid || assignedOf(j)===t.name))
    .sort((a,b) => jobTime(a) - jobTime(b));
}
function rangesOverlap(a0, a1, b0, b1){
  return a0.getTime() < b1.getTime() && a1.getTime() > b0.getTime();
}
function jobDayOk(j){
  if (j.scheduledDate) return j.scheduledDate === ymd(selectedDay);
  const t = j.appointment_start || j.appointmentStart || j.timeAt;
  if (t && t.toDate) return sameDay(t.toDate(), selectedDay);
  if (t instanceof Date) return sameDay(t, selectedDay);
  return true;
}
function assignedOf(j){
  return j.assignedTo || j.assignedUid || j.assignedUserId || j.uid || '';
}

function jobCardHtml(j, extraClass, posStyle){
  const st = jobTime(j);

    <div>${esc(tp.icon||'')} ${esc(addr)}</div><b>${esc(kind)}</b><div class="t">${when}</div></div>`;
}

async function doMove(id, hour, uid, reason){
  const j = jobs.find(x=>x.id===id) || {};
  const oldS = jobTime(j);
  const oldE = jobEnd(j, oldS);
  const dur = Math.max(15*60*1000, oldE - oldS);
  const start = new Date(selectedDay.getFullYear(), selectedDay.getMonth(), selectedDay.getDate(), hour, oldS.getMinutes());
  const end = new Date(start.getTime()+dur);
  if (rangesOverlapWorker(uid, start, end, id)) {
    if (!confirm('Este horario se cruza con otro trabajo de la misma persona. ¿Guardar igual?')) return;
  }
  const patch = {
    assignedTo: uid, assignedUid: uid,
    hour: start.getHours(), minute: start.getMinutes(),
    endHour: end.getHours(), endMinute: end.getMinutes(),
    startClock: toClock(start), endClock: toClock(end),
    scheduledDate: ymd(selectedDay),
    startTime: fmt(start), time: fmt(start), endTime: fmt(end),
    appointment_start: firebase.firestore.Timestamp.fromDate(start),
    appointment_end: firebase.firestore.Timestamp.fromDate(end),
    moveReason: reason,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  try { await db.collection('jobs').doc(id).set(patch,{merge:true}); }
  catch(e){ alert('No se pudo mover: '+(e.message||e)); return; }
  try { await db.collection('companies').doc(cid()).collection('jobs').doc(id).set(patch,{merge:true}); } catch(_){}
  $('modal').classList.add('hidden');
  loadBoard();
}

function openEdit(id){
  const j = jobs.find(x=>x.id===id);
  if (!j) return;
  editJobId = id;
  preWorker = assignedOf(j);
  const st = jobTime(j);
  const en = jobEnd(j, st);
  preHour = st.getHours();
  preStartClock = toClock(st);
  preEndClock = toClock(en);
  preKind = j.kind || '';
  selectedBuilding = j.buildingId || selectedBuilding;
  openAssign(j.kind);
}
function openAssign(kindPref){
  if (!canAssign()) { alert('No puedes asignar trabajos con este rol.'); return; }
  const chosen = kindPref || preKind || (allTypes(true)[0]&&allTypes(true)[0].name) || 'INSPECTION';
  const worker = preWorker || (techs[0]&&techs[0].uid) || (auth.currentUser&&auth.currentUser.uid) || '';
  const existing = editJobId ? jobs.find(x=>x.id===editJobId) : null;
  let startVal = preStartClock;
  let endVal = preEndClock;
  if (existing) {
    const st = jobTime(existing);
    const en = jobEnd(existing, st);
    startVal = toClock(st);
    endVal = toClock(en);
  }
  if (!startVal) startVal = String(preHour||9).padStart(2,'0')+':00';
  if (!endVal) {
    const p = startVal.split(':');
    endVal = String(Math.min(23, (parseInt(p[0],10)||9)+1)).padStart(2,'0')+':'+(p[1]||'00');
  }
  preKind = '';
  const bopts = '<option value="">— Dirección / sitio —</option>' + buildings.map(b=>`<option value="${b.id}" ${b.id===selectedBuilding?'selected':''}>${esc(b.name)}</option>`).join('');
  const topts = techs.map(t=>`<option value="${t.uid}" ${t.uid===worker?'selected':''}>${esc(t.name)}</option>`).join('');
  const kopts = allTypes(true).map(k=>`<option value="${esc(k.name)}" ${k.name===chosen?'selected':''}>${esc(k.icon||'')} ${esc(k.name)}</option>`).join('');
  const preset = typeOf(chosen);
  $('modal').classList.remove('hidden');
  $('modal').innerHTML = `<div class="box">
    <h3>${editJobId?'Editar / reasignar':'Assign Job'}</h3>
    <p class="muted">${ymd(selectedDay)} · ${esc(techs.find(t=>t.uid===worker)?.name||'')}</p>
    <label class="muted">${esc(pack().sitesLabel)}</label><select id="ajB">${bopts}</select>
    <label class="muted">Dirección (si no hay sitio)</label><input id="ajAddr" type="text" value="${esc(existing&&existing.address||'')}">
    <label class="muted">Trabajador</label><select id="ajT">${topts || '<option value="">Sin equipo</option>'}</select>
    <label class="muted">Start time</label><input id="ajStart" type="time" step="60" value="${startVal}">
    <label class="muted">End time</label><input id="ajEnd" type="time" step="60" value="${endVal}">
    <label class="muted">Tipo de trabajo</label><select id="ajK" onchange="onKindChange()">${kopts}</select>
    <label class="muted">Descripción</label><textarea id="ajD" rows="3" placeholder="Qué hay que hacer">${esc((existing&&existing.description)||preset.descriptionTemplate||'')}</textarea>
    <div class="err" id="ajErr"></div>
    ${canManageTypes()?'<p class="muted"><a href="/app/settings/job-types/">＋ Crear tipo</a></p>':''}
    <button class="btn" onclick="saveAssign()">${editJobId?'Guardar':'Asignar'}</button>
    <button class="btn ghost" onclick="editJobId='';preStartClock='';preEndClock='';$('modal').classList.add('hidden')">Cancelar</button>
  </div>`;
}
function onKindChange(){
  const t = typeOf($('ajK').value);
  if (t.descriptionTemplate) $('ajD').value = t.descriptionTemplate;
}
function rangesOverlapWorker(uid, start, end, exceptId){
  const tech = techs.find(t => t.uid === uid) || {uid, name:''};
  return jobsForTech(tech).some(j => {
    if (exceptId && j.id === exceptId) return false;
    const s = jobTime(j);
    const e = jobEnd(j, s);
    return rangesOverlap(start, end, s, e);
  });
}
async function saveAssign(){
  const err = $('ajErr');
  if (err) err.textContent = '';
  const bid = $('ajB').value;
  const uid = $('ajT').value;
  const kind = $('ajK').value;
  const start = clockToDate($('ajStart').value, selectedDay);
  const end = clockToDate($('ajEnd').value, selectedDay);
  const addrIn = ($('ajAddr')&&$('ajAddr').value.trim()) || '';
  if (!uid) { if (err) err.textContent = 'Elige un trabajador.'; return; }
  if (!cid()) { if (err) err.textContent = 'No hay compañía activa.'; return; }
  if (!start || !end) { if (err) err.textContent = 'Pon Start time y End time.'; return; }
  if (!(end.getTime() > start.getTime())) { if (err) err.textContent = 'End time must be after Start time.'; return; }
  if (rangesOverlapWorker(uid, start, end, editJobId)) {
    if (!confirm('Este horario se cruza con otro trabajo de la misma persona. ¿Guardar igual?')) return;
  }
  const b = buildings.find(x=>x.id===bid);
  const title = (b && b.name) || addrIn || kind || 'Job';
  const payload = {
    companyId: cid(), buildingId: bid || '', assignedTo: uid, assignedUid: uid,
    title, address: addrIn || title, kind,
    description: ($('ajD')&&$('ajD').value.trim()) || typeOf(kind).descriptionTemplate || '',
    color: typeOf(kind).color || '#34C759', icon: typeOf(kind).icon || '🔧',
    companyType, status: 'open',
    hour: start.getHours(), minute: start.getMinutes(),
    endHour: end.getHours(), endMinute: end.getMinutes(),
    startClock: toClock(start), endClock: toClock(end),
    scheduledDate: ymd(selectedDay),
    startTime: fmt(start), time: fmt(start), endTime: fmt(end),
    appointment_start: firebase.firestore.Timestamp.fromDate(start),
    appointment_end: firebase.firestore.Timestamp.fromDate(end),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  try {
    if (editJobId) {
      await db.collection('jobs').doc(editJobId).set(payload, {merge:true});
    } else {
      payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      await db.collection('jobs').add(payload);
    }
  } catch(e) {
    if (err) err.textContent = 'No se guardó: ' + (e.message || e);
    return;
  }
  editJobId = '';
  preWorker = '';
  preStartClock = '';
  preEndClock = '';
  $('modal').classList.add('hidden');
  await loadBoard();
}

async function openMoney(){
  if (!canSeeMoney()) { alert('El dinero de cada compañía es privado.'); return; }
  $('modal').classList.remove('hidden');
  $('modal').innerHTML = `<div class="box"><p class="muted">Cargando…</p></div>`;
  const month = ymd(selectedDay).slice(0,7);
  let rows = [];
  try {
    const snap = await db.collection('companies').doc(cid()).collection('ledger').limit(80).get();
    snap.forEach(d => rows.push({id:d.id, ...d.data()}));
  } catch(e){
    $('modal').innerHTML = `<div class="box"><h3>Dinero</h3><p class="err">${esc(e.message||'No se pudo leer')}</p><button class="btn ghost" onclick="$('modal').classList.add('hidden')">Cerrar</button></div>`;
    return;
  }
  const mine = rows.filter(r => String(r.date||'').startsWith(month));
  const earned = mine.filter(r=>r.type==='earned').reduce((s,r)=>s+Number(r.amount||0),0);
  const spent = mine.filter(r=>r.type==='spent').reduce((s,r)=>s+Number(r.amount||0),0);
  const list = mine.sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(r =>
    `<div style="padding:8px 0;border-bottom:1px solid #F2F2F7">${r.type==='earned'?'+':'-'} $${Number(r.amount).toFixed(2)} · ${esc(r.date)}<div class="muted">${esc(r.note||'')}</div></div>`
  ).join('') || '<p class="muted">Sin movimientos este mes.</p>';
  $('modal').innerHTML = `<div class="box">
    <h3>Dinero · ${esc(month)}</h3>
    <p><b>Earned</b> $${earned.toFixed(2)}<br><b>Spent</b> $${spent.toFixed(2)}<br><b>Profit</b> $${(earned-spent).toFixed(2)}</p>
    <label class="muted">Tipo</label>
    <select id="mnT"><option value="earned">Earned</option><option value="spent">Spent</option></select>
    <label class="muted">Monto</label><input id="mnA" type="number" min="0" step="0.01" placeholder="1000">
    <label class="muted">Fecha</label><input id="mnD" type="text" value="${ymd(new Date())}">
    <label class="muted">Nota</label><input id="mnN" type="text" placeholder="Earned $1000 / Spent $500">
    <div class="err" id="mnErr"></div>
    <button class="btn" onclick="saveMoney()">Guardar</button>
    <div style="margin-top:12px">${list}</div>
    <button class="btn ghost" onclick="$('modal').classList.add('hidden')">Cerrar</button>
  </div>`;
}
async function saveMoney(){
  if (!canSeeMoney()) return;
  const err = $('mnErr');
  const type = $('mnT').value;
  const amount = Number($('mnA').value);
  const date = ($('mnD').value||'').trim();
  const note = ($('mnN').value||'').trim();
  if (!(amount>=0) || !date || date.length!==10) { err.textContent = 'Monto y fecha YYYY-MM-DD.'; return; }
  try {
    await db.collection('companies').doc(cid()).collection('ledger').add({
      type, amount, date, note, companyId: cid(),
      createdBy: auth.currentUser.uid,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    openMoney();
  } catch(e) { err.textContent = e.message || 'No se guardó.'; }
}

async function addBuilding(){
  if (!isBoss()) return;
  const name = $('nbName').value.trim();
  const floors = Math.min(100, Math.max(1, parseInt($('nbFloors').value)||1));
  if (!name){ alert('Escribe el nombre del edificio'); return; }
  const ref = db.collection('buildings').doc();
  await ref.set({ id: ref.id, name, floors, companyId: cid(), kind: companyType === 'property_management' ? 'Inspections' : 'Site', companyType });
  try {
    await db.collection('companies').doc(cid()).collection('buildings').doc(ref.id)
      .set({ id: ref.id, name, floors, companyId: cid() });
  } catch(_){}
  $('nbName').value = '';
  loadBoard();
}

function renderMySchedule(){
  $('weekTitle').textContent = 'My Schedule';
  const uid = auth.currentUser && auth.currentUser.uid;
  const name = (profile.displayName || '').toLowerCase();
  const mine = jobs.filter(j => {
    const a = String(assignedOf(j)||'');
    if (selectedBuilding && j.buildingId && j.buildingId !== selectedBuilding) return false;
    return a === uid || a.toLowerCase() === name || a === name;
  });
  let html = `<div class="card"><h2>My Schedule</h2>`;
  if (!mine.length) html += '<p class="muted">No hay visitas asignadas.</p>';
  mine.forEach(j => {
    const addr = j.address || j.title || 'Job';
    const t = j.time || j.startTime || '9 AM';
    html += `<p><b>My ${esc(addr)} — ${esc(t)}</b></p>`;
  });
  html += '</div>';
  $('workerMain').innerHTML = html;
}
async function loadWorkerJobs(){ renderMySchedule(); }

const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function nombreMes(ym){ if(!ym) return ''; const p = String(ym).split('-'); return MESES[parseInt(p[1],10)-1] + ' ' + p[0]; }

async function loadMonths(buildingId){
  $('viewMonths').classList.remove('hidden');
  $('viewDetail').classList.add('hidden');
  const snap = await db.collection('walkthroughs').where('buildingId','==',buildingId).get();
  const list = []; snap.forEach(d => list.push({id:d.id, ...d.data()}));
  const b = buildings.find(x=>x.id===buildingId) || {name:''};
  let html = `<button class="back" onclick="$('viewMonths').classList.add('hidden')">← Schedule</button>
    <div class="card"><h2>${esc(b.name)}</h2>`;
  if (!list.length) html += '<p class="muted">Sin recorridos todavía.</p>';
  list.forEach(w => {
    html += `<p><button class="btn" onclick="alert('${esc(nombreMes(w.yearMonth))} · ${(w.findings||[]).length} hallazgos')">${esc(nombreMes(w.yearMonth))}</button></p>`;
  });
  html += '</div>';
  $('viewMonths').innerHTML = html;
}
</script>
