<style>

<body class="tab-agenda">
<header>
  <h1><a href="/">Walkcheck</a></h1>
  <div class="hdr-actions">
    <div class="lang-switch" role="group" aria-label="Language">
      <button type="button" data-set-lang="es" onclick="setLoginLang('es')">ES</button>
      <button type="button" data-set-lang="en" onclick="setLoginLang('en')">EN</button>
    </div>
    <span id="roleChip"></span>
    <button id="moneyBtn" class="hidden" onclick="openMoney()" data-i18n="money">Dinero</button>
    <a id="typesLink" href="/app/settings/job-types/" class="hidden" data-i18n="types">Tipos</a>
    <a id="adminLink" href="/admin/" class="hidden">SUPER ADMIN</a>
    <button id="btnLogout" class="hidden" data-i18n="logout">Cerrar sesión</button>
  </div>
</header>
<button class="btn" id="deskToggle" onclick="toggleDesk()">Ver 2 columnas</button>
<div id="phoneTabs">
  <button data-tab="edificios" onclick="setTab('edificios')" data-i18n="buildings">Edificios</button>
  <button class="on" data-tab="agenda" onclick="setTab('agenda')" data-i18n="agenda">Agenda</button>
  <button data-tab="mapa" onclick="setTab('mapa')" data-i18n="map">Mapa</button>
</div>

<div id="login">
  <div class="login-head">
    <h3 id="loginTitle">Entrar a Walkcheck</h3>
    <div class="lang-switch" role="group" aria-label="Language">
      <button type="button" data-set-lang="es" onclick="setLoginLang('es')">ES</button>
      <button type="button" data-set-lang="en" onclick="setLoginLang('en')">EN</button>
    </div>
  </div>
  <p class="muted" id="loginLead">El panel de tu compañía: recorridos, fotos y reportes en un solo lugar.</p>
  <input type="email" id="email" placeholder="Correo" autocomplete="username">
  <div class="pw-wrap">
    <input type="password" id="password" placeholder="Contraseña" autocomplete="current-password">
    <button type="button" class="pw-eye" id="pwEye" onclick="togglePw()" aria-label="Mostrar contraseña">👁</button>
  </div>
  <label class="keep"><input type="checkbox" id="keepIn" checked> <span id="keepLbl">Mantener mi sesión iniciada</span></label>
  <div class="login-links">
    <a href="#" id="forgotLink" onclick="forgotPw();return false;">¿Olvidaste tu contraseña?</a>
    <a href="/register/" id="regLink">Registrar</a>
  </div>

  let minH = 6, maxH = 20;
  jobs.filter(jobDayOk).forEach(j => {

    minH = Math.min(minH, st.getHours());
    maxH = Math.max(maxH, en.getHours(), st.getHours());
  });

  for (let h = minH; h <= maxH; h++) arr.push(h);
  return arr;
}

function weekStart(d){
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() - (x.getDay()));
  return x;
}
function sameDay(a,b){
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}
function hLabel(h){ const h12 = h%12===0?12:h%12; return h12 + ' ' + (h<12?'AM':'PM'); }

function renderWeek(){
  const ws = weekStart(selectedDay);
  const end = new Date(ws); end.setDate(end.getDate()+6);
  const meses = loginLang()==='es'
    ? ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic']
    : ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  $('weekTitle').textContent = isPhone()
    ? uiT('teamSchedule')
    : `${uiT('teamSchedule')} — ${uiT('weekOf')} ${meses[ws.getMonth()]} ${ws.getDate()}–${end.getDate()}, ${ws.getFullYear()}`;
  const letters = ['S','M','T','W','T','F','S'];
  let html = '';
  for (let i=0;i<7;i++){
    const d = new Date(ws); d.setDate(ws.getDate()+i);

  const openUp = spaceBelow < 180 && r.top > spaceBelow;

function clockToDate(clock, day){
  const d = day || selectedDay;
  const p = String(clock||'').split(':');
  const h = parseInt(p[0],10);
  const m = parseInt(p[1],10);
  if (isNaN(h) || isNaN(m)) return null;
  return new Date(d.getFullYear(), d.getMonth(), d.getDate(), h, m, 0, 0);
}
function toClock(d){
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function parseLooseTime(raw, day){
  const d = day || selectedDay;
  const s = String(raw||'').toUpperCase().replace('.',':').trim();
  const num = s.replace(/[^0-9:]/g,'');
  let h=9, m=0;
  if (/^\d{1,2}$/.test(num)) h = parseInt(num,10);
  else if (num.includes(':')) { const p=num.split(':'); h=parseInt(p[0],10)||9; m=parseInt(p[1],10)||0; }
  if (s.includes('PM') && h<12) h+=12;
  if (s.includes('AM') && h===12) h=0;
  return new Date(d.getFullYear(), d.getMonth(), d.getDate(), h, m, 0, 0);
}
function jobTime(j){
  const d = selectedDay;
  const fromClock = clockToDate(j.startClock || j.startHHMM, d);
  if (fromClock) return fromClock;
  if (typeof j.hour === 'number') {
    return new Date(d.getFullYear(), d.getMonth(), d.getDate(), j.hour, j.minute||0);
  }
  const t = j.appointment_start || j.appointmentStart;
  if (t && t.toDate) {
    const x = t.toDate();
    return new Date(d.getFullYear(), d.getMonth(), d.getDate(), x.getHours(), x.getMinutes());
  }
  return parseLooseTime(j.time || j.startTime, d);
}
function jobEnd(j, start){
  const fromClock = clockToDate(j.endClock || j.endHHMM, selectedDay);
  if (fromClock) return fromClock;
  if (typeof j.endHour === 'number') {
    return new Date(selectedDay.getFullYear(), selectedDay.getMonth(), selectedDay.getDate(), j.endHour, j.endMinute||0);
  }
  const t = j.appointment_end || j.appointmentEnd;
  if (t && t.toDate) {
    const x = t.toDate();
    return new Date(selectedDay.getFullYear(), selectedDay.getMonth(), selectedDay.getDate(), x.getHours(), x.getMinutes());
  }
  if (j.endTime) {
    const e = parseLooseTime(j.endTime, selectedDay);
    if (e > start) return e;
  }
  return new Date(start.getTime()+60*60*1000);
}

function jobDayOk(j){

  return true;
}
function assignedOf(j){

function looksLikeAccountId(v){
  v = String(v||'');
  return v.length >= 20 && v.indexOf(' ') < 0 && v.indexOf('@') < 0;
}
function accountUidOf(j){
  const raw = String(assignedOf(j)||'');
  if (techs.some(t => t.uid === raw)) return raw;
  const em = String(j.assignedEmail||'').toLowerCase();
  const byEmail = em && techs.find(t => t.email && t.email === em);
  if (byEmail) return byEmail.uid;
  const name = j.assignedName || raw;
  const byName = techs.find(t => t.name && (t.name === name || t.name === raw));
  if (byName && (!looksLikeAccountId(raw) || raw === byName.uid)) return byName.uid;
  return looksLikeAccountId(raw) ? raw : '';
}
function assignmentPatch(uid){

  return {

    assignedName: tech.name || '',

function repairJobAccounts(){

    if (!raw) return;
    if (techs.some(t => t.uid === raw) && j.workerId === raw && j.assignedUid === raw) return;

  });

function cardAddr(j){

function cardGeom(j){
  const st = jobTime(j);
  const en = jobEnd(j, st);
  const hours = Math.max(0.5, (en - st) / 3600000);
  return {
    st, en,
    left: ((st.getHours() + st.getMinutes() / 60) - START) * SLOT,
    w: Math.max(150, hours * SLOT),
    h: Math.max(92, Math.min(148, hours * 96))
  };
}

async function doMove(id, hour, uid, reason){
  const j = jobs.find(x=>x.id===id) || {};
  const oldS = jobTime(j);
  const oldE = jobEnd(j, oldS);
  const dur = Math.max(15*60*1000, oldE - oldS);
  const start = new Date(selectedDay.getFullYear(), selectedDay.getMonth(), selectedDay.getDate(), hour, oldS.getMinutes());
  const end = new Date(start.getTime()+dur);
  if (rangesOverlapWorker(uid, start, end, id)) {
    if (!confirm('Este horario se cruza con otro trabajo de la misma persona. ¿Guardar igual?')) return;
  }
  const patch = {
    ...assignmentPatch(uid),
    hour: start.getHours(), minute: start.getMinutes(),
    endHour: end.getHours(), endMinute: end.getMinutes(),
    startClock: toClock(start), endClock: toClock(end),
    scheduledDate: ymd(selectedDay),
    startTime: fmt(start), time: fmt(start), endTime: fmt(end),
    appointment_start: firebase.firestore.Timestamp.fromDate(start),
    appointment_end: firebase.firestore.Timestamp.fromDate(end),
    moveReason: reason,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  try { await db.collection('jobs').doc(id).set(patch,{merge:true}); }
  catch(e){ alert('No se pudo mover: '+(e.message||e)); return; }
  $('modal').classList.add('hidden');
  loadBoard();
}

function requiredReportCount(r){
  r = r || {};
  const checks = [
    !!(r.actualStart),
    !!(r.actualEnd),
    !!(r.problem && String(r.problem).trim()),
    Array.isArray(r.beforePhotos) ? r.beforePhotos.length>0 : !!(r.beforePhoto),
    r.solved === true || r.solved === false,
    !!(r.solution && String(r.solution).trim()),
    r.expensesTotal !== '' && r.expensesTotal != null && !isNaN(Number(r.expensesTotal)),
    !!(r.supplier && String(r.supplier).trim()),
    !!(r.receiptPhoto),
    !!(r.finalNotes && String(r.finalNotes).trim())
  ];
  return checks.filter(Boolean).length;
}

async function saveJobReport(id, complete){
  const err = $('rpErr');
  if (err) err.textContent = '';
  let j = jobs.find(x=>x.id===id) || {};
  try {
    const d = await db.collection('jobs').doc(id).get();
    if (d.exists) j = {id, ...d.data()};
  } catch(_){}
  const prev = j.report || {};
  let beforePhotos = Array.isArray(prev.beforePhotos) ? prev.beforePhotos.slice() : [];
  if (prev.beforePhoto && !beforePhotos.includes(prev.beforePhoto)) beforePhotos.push(prev.beforePhoto);
  const bf = $('rpBefore') && $('rpBefore').files;
  try {
    if (bf && bf.length) {
      for (let i=0;i<bf.length;i++) beforePhotos.push(await uploadJobFile(id, 'before', bf[i]));
    }
  } catch(e){ if (err) err.textContent = 'Foto: '+(e.message||e); return; }
  let receipt = prev.receiptPhoto || '';
  try {
    const rf = $('rpRec') && $('rpRec').files && $('rpRec').files[0];
    if (rf) receipt = await uploadJobFile(id, 'receipt', rf);
  } catch(e){ if (err) err.textContent = 'Receipt: '+(e.message||e); return; }
  const solvedVal = $('rpSolved').value;
  const report = {
    actualStart: $('rpAS').value || '',
    actualEnd: $('rpAE').value || '',
    problem: ($('rpP').value||'').trim(),
    beforePhotos,
    solved: solvedVal==='' ? null : solvedVal==='yes',
    solution: ($('rpS').value||'').trim(),
    expensesTotal: $('rpEx').value === '' ? null : Number($('rpEx').value),
    supplier: ($('rpSup').value||'').trim(),
    receiptPhoto: receipt,
    finalNotes: ($('rpN').value||'').trim(),
    draft: !complete,
    completed: false,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    updatedBy: auth.currentUser && auth.currentUser.uid
  };
  const n = requiredReportCount(report);
  report.requiredDone = n;
  report.requiredTotal = 10;
  if (complete) {
    if (n < 10) { if (err) err.textContent = n+'/10 required fields. Completa el reporte.'; return; }
    report.completed = true;
    report.draft = false;
  }
  try {
    const patch = { report, reportCompleted: !!report.completed, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
    if (report.completed) patch.status = 'completed';
    await db.collection('jobs').doc(id).set(patch, {merge:true});
    if (report.completed) {
      await db.collection('jobReports').add({
        jobId: id, companyId: cid(), workerId: assignedOf(j),
        actualStart: report.actualStart, actualEnd: report.actualEnd,
        problem: report.problem, solution: report.solution, solved: report.solved,
        expensesTotal: report.expensesTotal, supplier: report.supplier,
        beforePhotos: report.beforePhotos, receiptPhoto: report.receiptPhoto,
        finalNotes: report.finalNotes, status: 'completed',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }
  } catch(e){ if (err) err.textContent = e.message||e; return; }
  await loadBoard();
  await openJobView(id);
}

    });
    openMoney();
  } catch(e) { err.textContent = e.message || 'No se guardó.'; }
}

async function addBuilding(){
  if (!isBoss()) return;
  const name = $('nbName').value.trim();
  const floors = Math.min(100, Math.max(1, parseInt($('nbFloors').value)||1));
  if (!name){ alert(uiT('needBuilding')); return; }
  const ref = db.collection('buildings').doc();
  await ref.set({ id: ref.id, name, floors, companyId: cid(), kind: companyType === 'property_management' ? 'Inspections' : 'Site', companyType });
  try {
    await db.collection('companies').doc(cid()).collection('buildings').doc(ref.id)
      .set({ id: ref.id, name, floors, companyId: cid() });
  } catch(_){}
  $('nbName').value = '';
  loadBoard();
}

function renderMySchedule(){
  $('weekTitle').textContent = uiT('mySchedule');
  const uid = auth.currentUser && auth.currentUser.uid;
  const mine = jobs.filter(j => {
    if (selectedBuilding && j.buildingId && j.buildingId !== selectedBuilding) return false;
    if (isPhone() && !jobDayOk(j)) return false;
    const a = accountUidOf(j);
    const em = String(j.assignedEmail||'').toLowerCase();
    const myEmail = String((auth.currentUser && auth.currentUser.email) || '').toLowerCase();
    return a === uid || (myEmail && em === myEmail);
  }).sort((a,b)=> jobTime(a)-jobTime(b));
  const done = mine.filter(jobDone).length;
  let html = `<div id="dayList"><p class="muted" style="margin:0 0 10px">${done}/${mine.length} done</p>`;
  if (!mine.length) html += '<div class="day-empty">No hay visitas asignadas.</div>';
  mine.forEach(j => {
    const addr = j.address || j.title || 'Job';
    const st = jobTime(j); const en = jobEnd(j, st);
    const tp = typeOf(j.kind || 'Job');
    html += `<button type="button" class="daycard" onclick="openJobView('${j.id}')" style="border-left:6px solid ${esc(tp.color||'#34C759')}">
      <div class="daycard-k">${jobDone(j)?'✓ ':''}${esc(j.kind||'Job')}</div>
      <div class="daycard-t">${fmt(st)} – ${fmt(en)}</div>
      <div class="daycard-a">${esc(addr)}</div>
    </button>`;
  });
  html += '</div>';
  $('workerMain').innerHTML = html;
}
async function loadWorkerJobs(){ renderMySchedule(); }

const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function nombreMes(ym){ if(!ym) return ''; const p = String(ym).split('-'); return MESES[parseInt(p[1],10)-1] + ' ' + p[0]; }

async function loadMonths(buildingId){
  $('viewMonths').classList.remove('hidden');
  $('viewDetail').classList.add('hidden');
  const snap = await db.collection('walkthroughs').where('buildingId','==',buildingId).get();
  const list = []; snap.forEach(d => list.push({id:d.id, ...d.data()}));
  const b = buildings.find(x=>x.id===buildingId) || {name:''};
  let html = `<button class="back" onclick="$('viewMonths').classList.add('hidden')">← Schedule</button>
    <div class="card"><h2>${esc(b.name)}</h2>`;
  if (!list.length) html += '<p class="muted">Sin recorridos todavía.</p>';
  list.forEach(w => {
    html += `<p><button class="btn" onclick="alert('${esc(nombreMes(w.yearMonth))} · ${(w.findings||[]).length} hallazgos')">${esc(nombreMes(w.yearMonth))}</button></p>`;
  });
  html += '</div>';
  $('viewMonths').innerHTML = html;
}
