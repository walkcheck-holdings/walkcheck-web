<body class="tab-agenda">
<header>
  <h1><a href="/">Walkcheck</a></h1>
  <div style="display:flex;align-items:center;gap:10px">
    <div class="lang-switch" role="group" aria-label="Language">
      <button type="button" data-set-lang="es" onclick="setLoginLang('es')">ES</button>
      <button type="button" data-set-lang="en" onclick="setLoginLang('en')">EN</button>
    </div>
    <span id="roleChip"></span>
    <button id="moneyBtn" class="hidden" onclick="openMoney()">Dinero</button>
    <a id="typesLink" href="/app/settings/job-types/" class="hidden" style="color:#fff;text-decoration:none;padding:8px 12px;border-radius:8px;font-weight:800;font-size:13px;background:rgba(0,0,0,.18)">Tipos</a>
    <a id="adminLink" href="/admin/" class="hidden" style="color:#fff;text-decoration:none;padding:8px 12px;border-radius:8px;font-weight:800;font-size:13px">SUPER ADMIN</a>
    <button id="btnLogout" class="hidden">Cerrar sesión</button>
  </div>
</header>
<button class="btn" id="deskToggle" onclick="toggleDesk()">Ver 2 columnas</button>
<div id="phoneTabs">
  <button data-tab="edificios" onclick="setTab('edificios')">Edificios</button>
  <button class="on" data-tab="agenda" onclick="setTab('agenda')">Agenda</button>
  <button data-tab="mapa" onclick="setTab('mapa')">Mapa</button>
</div>

<div id="login">
  <div class="login-head">
    <h3 id="loginTitle">Entrar a Walkcheck</h3>
    <div class="lang-switch" role="group" aria-label="Language">
      <button type="button" data-set-lang="es" onclick="setLoginLang('es')">ES</button>
      <button type="button" data-set-lang="en" onclick="setLoginLang('en')">EN</button>
    </div>
  </div>
  <p class="muted" id="loginLead">El panel de tu compañía: recorridos, fotos y reportes en un solo lugar.</p>
  <input type="email" id="email" placeholder="Correo" autocomplete="username">
  <div class="pw-wrap">
    <input type="password" id="password" placeholder="Contraseña" autocomplete="current-password">
    <button type="button" class="pw-eye" id="pwEye" onclick="togglePw()" aria-label="Mostrar contraseña">👁</button>
  </div>
  <label class="keep"><input type="checkbox" id="keepIn" checked> <span id="keepLbl">Mantener mi sesión iniciada</span></label>
  <div class="login-links">
    <a href="#" id="forgotLink" onclick="forgotPw();return false;">¿Olvidaste tu contraseña?</a>
    <a href="/register/" id="regLink">Registrar</a>
  </div>
  <button class="btn" id="btnLogin">Entrar</button>
  <div class="err" id="loginErr"></div>
  <p class="okmsg" id="loginOk"></p>
  <p class="muted" style="margin-top:16px;text-align:center"><a href="mailto:soporte@walkcheck.app">Soporte:  soporte@walkcheck.app</a></p>
</div>

<div id="board" class="flex flex-col lg:flex-row">
  <aside id="sidebar">
    <h2 id="sitesTitle">Buildings</h2>
    <div style="padding:0 14px">
      <input type="text" id="bSearch" placeholder="Search buildings...">
    </div>
    <div class="chips">
      <button class="chip on" data-f="All">All</button>
      <button class="chip pm-only" data-f="Inspections">Inspections</button>
      <button class="chip pm-only" data-f="Maintenance">Maintenance</button>
    </div>
    <div id="bList"></div>
    <div class="addbox" id="addbox">
      <div class="muted" style="font-weight:800;margin-bottom:6px">＋ Nuevo edificio</div>
      <input type="text" id="nbName" placeholder="Nombre del edificio">
      <input type="number" id="nbFloors" value="1" min="1" max="100">
      <button class="btn" onclick="addBuilding()">Agregar</button>
    </div>
  </aside>
  <section id="main">
    <div class="weekbar">
      <div id="typeBar"></div>
      <div style="display:flex;align-items:center;gap:8px">
        <h2 id="weekTitle">Team Schedule</h2>
        <button class="btn ok" onclick="goToday()">Today</button>
        <button class="btn ok ghost" onclick="alert('Filters: Inspections / Maintenance en la izquierda')">Filters</button>
      </div>
      <div class="weekdays" id="weekdays"></div>
    </div>
    <div id="staffMain">
      <div class="hours" id="hours"></div>
      <div id="rows"></div>
      <div id="assignBar" class="hidden">
        <button class="btn" onclick="openAssign()">+ Assign Job</button>
      </div>
    </div>
    <div id="workerMain" class="hidden" style="overflow:auto;flex:1"></div>
  </section>
  <div id="mapPane"></div>
  <div id="teamPane"></div>
</div>
<nav id="bottomNav">
  <button onclick="goToday();setTab('agenda')">Hoy</button>
  <button onclick="setTab('edificios')">Edificios</button>
  <button onclick="setTab('equipo')">Equipo</button>
  <button class="plus" onclick="phonePlus()">＋ Nuevo</button>
</nav>

<div id="viewJobs" class="hidden"></div>
<div id="viewMonths" class="hidden" style="padding:16px"></div>
<div id="viewDetail" class="hidden" style="padding:16px"></div>
<div id="modal" class="modal hidden"></div>

function dayHours(){
  let minH = 6, maxH = 20;
  jobs.filter(jobDayOk).forEach(j => {
    const st = jobTime(j);
    const en = jobEnd(j, st);
    minH = Math.min(minH, st.getHours());
    maxH = Math.max(maxH, en.getHours(), st.getHours());
  });
  if (preHour != null) { minH = Math.min(minH, preHour); maxH = Math.max(maxH, preHour+1); }
  const arr = [];
  for (let h = minH; h <= maxH; h++) arr.push(h);
  return arr;
}

function slugify(n){
  return String(n||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
}
function defaultTypes(){
  return pack().jobs.map(n => ({
    name: n, slug: slugify(n), icon: '🔧', color: '#34C759',
    descriptionTemplate: '', category: companyType, custom: false
  }));
}
function allTypes(activeOnly){
  const defs = defaultTypes();
  const extra = customTypes.filter(t => !activeOnly || t.isActive !== false);
  const names = new Set(defs.map(d => d.name.toLowerCase()));
  extra.forEach(t => { if (!names.has(String(t.name||'').toLowerCase())) defs.push({...t, custom:true}); });
  return defs;
}
function typeOf(kind){
  const k = String(kind||'').toLowerCase();
  return allTypes(false).find(t => String(t.name).toLowerCase()===k || t.slug===k) || { color:'#34C759', icon:'🔧', name: kind||'Job' };
}

function ymd(d){
  const x = d instanceof Date ? d : new Date(d);
  return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
}

async function enforceTrial(){
  if (isSuper()) return true;
  try {
    const co = await db.collection('companies').doc(cid()).get();
    const d = co.data() || {};
    if (d.is_paid === true) return true;
    const raw = d.trialEnds || d.trial_end;
    let end = null;
    if (raw && raw.toDate) end = raw.toDate();
    else if (typeof raw === 'string') end = new Date(raw);
    if (!end || isNaN(end.getTime())) return true;
    if (Date.now() < end.getTime()) return true;
    location.href = '/pricing/';
    return false;
  } catch(_) { return true; }
}

function weekStart(d){
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() - (x.getDay()));
  return x;
}
function sameDay(a,b){
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}
function hLabel(h){ const h12 = h%12===0?12:h%12; return h12 + ' ' + (h<12?'AM':'PM'); }

function renderWeek(){
  const ws = weekStart(selectedDay);
  const end = new Date(ws); end.setDate(end.getDate()+6);
  const meses = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  $('weekTitle').textContent = `Team Schedule — Week of ${meses[ws.getMonth()]} ${ws.getDate()}–${end.getDate()}, ${ws.getFullYear()}`;
  const letters = ['S','M','T','W','T','F','S'];
  let html = '';
  for (let i=0;i<7;i++){
    const d = new Date(ws); d.setDate(ws.getDate()+i);
    html += `<div class="wd ${sameDay(d,selectedDay)?'on':''}" onclick="pickDay(${d.getTime()})"><div class="d">${letters[i]}</div>${d.getDate()}</div>`;
  }
  $('weekdays').innerHTML = html;
}

async function loadBoard(){
  renderWeek();
  if (isSuper() && !cid()) {
    await loadCompaniesSidebar();
    if (!viewCid && companyList[0]) viewCid = companyList[0].id;
  }
  const id = cid();
  if (!id) {
    $('rows').innerHTML = '<div class="card muted">Elige una compañía a la izquierda.</div>';
    return;
  }
  try {
    const co = await db.collection('companies').doc(id).get();
    const raw = (co.exists && (co.data().companyType || co.data().industry || co.data().trade)) || 'property_management';
    companyType = String(raw).toLowerCase().replace(/\s+/g,'_');
    if (!(window.JOB_TEMPLATES||{})[companyType]) {
      if (/electric/.test(companyType)) companyType = 'electrical';
      else if (/plumb/.test(companyType)) companyType = 'plumbing';
      else if (/hvac|air/.test(companyType)) companyType = 'hvac';
      else if (/roof/.test(companyType)) companyType = 'roofing';
      else if (/clean/.test(companyType)) companyType = 'cleaning';
      else if (/construct/.test(companyType)) companyType = 'construction';
      else companyType = 'property_management';
    }
  } catch(_) { companyType = 'property_management'; }
  applyCompanyPanel();
  if (isSuper()) await loadCompaniesSidebar();
  else {
    $('sitesTitle').style.display = '';
    $('sitesTitle').textContent = pack().sitesLabel;
    $('bSearch').placeholder = pack().searchPlaceholder;
    $('addbox').classList.toggle('hidden', !isBoss());
  }
  const bDocs = [];
  let s = await colGet(db.collection('buildings').where('companyId','==',id).limit(50).get());
  if (s) s.forEach(d => bDocs.push({id:d.id, ...d.data()}));
  s = await colGet(db.collection('companies').doc(id).collection('buildings').limit(50).get());
  if (s) s.forEach(d => { if (!bDocs.some(x=>x.id===d.id)) bDocs.push({id:d.id, ...d.data()}); });
  bDocs.sort((a,b)=> String(a.name||'').localeCompare(String(b.name||'')));
  buildings = bDocs.slice(0,50);

  const tDocs = [];
  s = await colGet(db.collection('users').where('companyId','==',id).limit(50).get());
  if (s) s.forEach(d => tDocs.push({uid:d.id, name:d.data().displayName||'Tech', role:d.data().role||'worker'}));
  const me = auth.currentUser && auth.currentUser.uid;
  if (me && !tDocs.some(t => t.uid === me)) {
    tDocs.unshift({uid: me, name: profile.displayName || 'Yo', role: profile.role || 'owner'});
  }
  techs = tDocs;

  const jDocs = [];
  s = await colGet(db.collection('jobs').where('companyId','==',id).limit(50).get());
  if (s) s.forEach(d => jDocs.push({id:d.id, ...d.data()}));
  s = await colGet(db.collection('companies').doc(id).collection('jobs').limit(50).get());
  if (s) s.forEach(d => { if (!jDocs.some(x=>x.id===d.id)) jDocs.push({id:d.id, ...d.data()}); });
  s = await colGet(db.collection('walkthroughs').where('companyId','==',id).limit(50).get());
  if (s) s.forEach(d => jDocs.push({id:d.id, ...d.data(), _wt:true}));
  jobs = jDocs;
  customTypes = [];
  try {
    const ts = await db.collection('companies').doc(id).collection('customJobTypes').limit(50).get();
    ts.forEach(d => customTypes.push({id:d.id, ...d.data()}));
  } catch(_){}
  renderTypeBar();
  if (!isSuper()) renderBuildings();
  renderMap();
  renderTeam();
  $('moneyBtn').classList.toggle('hidden', !canSeeMoney());
  if (isBoss()) renderRows();
  else renderMySchedule();
}

    const us = await db.collection('users').limit(200).get();

function frequentTypes(){
  const types = allTypes(true);
  const counts = {};
  (jobs||[]).forEach(j => {
    const k = String(j.kind||'').toLowerCase();
    if (k) counts[k] = (counts[k]||0) + 1;
  });
  const scored = types.map(t => {
    const key = String(t.name||'').toLowerCase();
    const slug = String(t.slug||'').toLowerCase();
    const n = (counts[key]||0) + (slug && slug !== key ? (counts[slug]||0) : 0)
      + (Number(t.useCount||t.usageCount||t.count||0)||0);
    return { t, n };
  });
  if (scored.some(x => x.n > 0)) scored.sort((a,b) => b.n - a.n);
  return scored.slice(0, 5).map(x => x.t);
}

function placeTypeDrop(id){
  const btn = $('comboBtn-'+id);
  const drop = $('comboDrop-'+id);
  if (!btn || !drop) return;
  if (drop.closest('.modal')) {
    drop.style.position = 'absolute';
    drop.style.left = '0';
    drop.style.right = '0';
    drop.style.width = '100%';
    drop.style.top = '100%';
    drop.style.bottom = 'auto';
    drop.style.maxHeight = '220px';
    return;
  }
  drop.style.position = 'fixed';
  const r = btn.getBoundingClientRect();
  const width = Math.max(r.width, 220);
  const left = Math.min(r.left, Math.max(8, window.innerWidth - width - 8));
  const spaceBelow = window.innerHeight - r.bottom - 12;
  const openUp = spaceBelow < 180 && r.top > spaceBelow;
  drop.style.left = left+'px';
  drop.style.width = width+'px';
  drop.style.maxHeight = Math.min(280, Math.max(160, openUp ? r.top - 12 : spaceBelow))+'px';
  if (openUp) {
    drop.style.top = 'auto';
    drop.style.bottom = (window.innerHeight - r.top + 4)+'px';
  } else {
    drop.style.bottom = 'auto';
    drop.style.top = (r.bottom + 4)+'px';
  }
}

function clockToDate(clock, day){
  const d = day || selectedDay;
  const p = String(clock||'').split(':');
  const h = parseInt(p[0],10);
  const m = parseInt(p[1],10);
  if (isNaN(h) || isNaN(m)) return null;
  return new Date(d.getFullYear(), d.getMonth(), d.getDate(), h, m, 0, 0);
}
function toClock(d){
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function parseLooseTime(raw, day){
  const d = day || selectedDay;
  const s = String(raw||'').toUpperCase().replace('.',':').trim();
  const num = s.replace(/[^0-9:]/g,'');
  let h=9, m=0;
  if (/^\d{1,2}$/.test(num)) h = parseInt(num,10);
  else if (num.includes(':')) { const p=num.split(':'); h=parseInt(p[0],10)||9; m=parseInt(p[1],10)||0; }
  if (s.includes('PM') && h<12) h+=12;
  if (s.includes('AM') && h===12) h=0;
  return new Date(d.getFullYear(), d.getMonth(), d.getDate(), h, m, 0, 0);
}
function jobTime(j){
  const d = selectedDay;
  const fromClock = clockToDate(j.startClock || j.startHHMM, d);
  if (fromClock) return fromClock;
  if (typeof j.hour === 'number') {
    return new Date(d.getFullYear(), d.getMonth(), d.getDate(), j.hour, j.minute||0);
  }
  const t = j.appointment_start || j.appointmentStart;
  if (t && t.toDate) {
    const x = t.toDate();
    return new Date(d.getFullYear(), d.getMonth(), d.getDate(), x.getHours(), x.getMinutes());
  }
  return parseLooseTime(j.time || j.startTime, d);
}
function jobEnd(j, start){
  const fromClock = clockToDate(j.endClock || j.endHHMM, selectedDay);
  if (fromClock) return fromClock;
  if (typeof j.endHour === 'number') {
    return new Date(selectedDay.getFullYear(), selectedDay.getMonth(), selectedDay.getDate(), j.endHour, j.endMinute||0);
  }
  const t = j.appointment_end || j.appointmentEnd;
  if (t && t.toDate) {
    const x = t.toDate();
    return new Date(selectedDay.getFullYear(), selectedDay.getMonth(), selectedDay.getDate(), x.getHours(), x.getMinutes());
  }
  if (j.endTime) {
    const e = parseLooseTime(j.endTime, selectedDay);
    if (e > start) return e;
  }
  return new Date(start.getTime()+60*60*1000);
}
function jobsForTech(t){
  return jobs.filter(j => jobDayOk(j) && (assignedOf(j)===t.uid || assignedOf(j)===t.name))
    .sort((a,b) => jobTime(a) - jobTime(b));
}
function rangesOverlap(a0, a1, b0, b1){
  return a0.getTime() < b1.getTime() && a1.getTime() > b0.getTime();
}
function jobDayOk(j){
  if (j.scheduledDate) return j.scheduledDate === ymd(selectedDay);
  const t = j.appointment_start || j.appointmentStart || j.timeAt;
  if (t && t.toDate) return sameDay(t.toDate(), selectedDay);
  if (t instanceof Date) return sameDay(t, selectedDay);
  return true;
}
function assignedOf(j){
  return j.assignedTo || j.assignedUid || j.assignedUserId || j.uid || '';
}

function cardAddr(j){
  const raw = String(j.address || j.buildingName || j.title || 'Job').split(/[—–|]/)[0];
  return raw.replace(/,/g, ' ').replace(/\s+/g, ' ').trim();
}
function cardGeom(j){
  const st = jobTime(j);
  const en = jobEnd(j, st);
  const hours = Math.max(0.5, (en - st) / 3600000);
  return {
    st, en,
    left: ((st.getHours() + st.getMinutes() / 60) - START) * SLOT,
    w: Math.max(150, hours * SLOT),
    h: Math.max(92, Math.min(148, hours * 96))
  };
}
function jobCardHtml(j, extraClass, posStyle){
  const g = cardGeom(j);
  const addr = cardAddr(j);
  const kind = j.kind || 'INSPECTION';
  const tp = typeOf(kind);
  const when = fmt(g.st)+' – '+fmt(g.en);
  const pos = posStyle || `left:${g.left}px;width:${g.w}px;height:${g.h}px`;
  return `<div class="jcard ${extraClass||''}" ${isBoss()?'draggable="true" ondragstart="dragJob(event,\''+j.id+'\')"':''} onclick="event.stopPropagation();openEdit('${j.id}')" style="background:${esc(tp.color||'#34C759')};${pos}">
    <div class="jcard-addr">${esc(tp.icon||'')} ${esc(addr)}</div>
    <div class="jcard-kind">${esc(kind)}</div>
    <div class="jcard-t">${when}</div></div>`;
}

async function doMove(id, hour, uid, reason){
  const j = jobs.find(x=>x.id===id) || {};
  const oldS = jobTime(j);
  const oldE = jobEnd(j, oldS);
  const dur = Math.max(15*60*1000, oldE - oldS);
  const start = new Date(selectedDay.getFullYear(), selectedDay.getMonth(), selectedDay.getDate(), hour, oldS.getMinutes());
  const end = new Date(start.getTime()+dur);
  if (rangesOverlapWorker(uid, start, end, id)) {
    if (!confirm('Este horario se cruza con otro trabajo de la misma persona. ¿Guardar igual?')) return;
  }
  const patch = {
    assignedTo: uid, assignedUid: uid,
    hour: start.getHours(), minute: start.getMinutes(),
    endHour: end.getHours(), endMinute: end.getMinutes(),
    startClock: toClock(start), endClock: toClock(end),
    scheduledDate: ymd(selectedDay),
    startTime: fmt(start), time: fmt(start), endTime: fmt(end),
    appointment_start: firebase.firestore.Timestamp.fromDate(start),
    appointment_end: firebase.firestore.Timestamp.fromDate(end),
    moveReason: reason,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  try { await db.collection('jobs').doc(id).set(patch,{merge:true}); }
  catch(e){ alert('No se pudo mover: '+(e.message||e)); return; }
  try { await db.collection('companies').doc(cid()).collection('jobs').doc(id).set(patch,{merge:true}); } catch(_){}
  $('modal').classList.add('hidden');
  loadBoard();
}

function openAssign(kindPref){

  }

    <div class="err" id="ajErr"></div>
    <button class="btn" onclick="saveAssign()">${editJobId?'Guardar':'Asignar'}</button>
    <button class="btn ghost" onclick="editJobId='';preStartClock='';preEndClock='';$('modal').classList.add('hidden')">Cancelar</button>

function onKindChange(){
  const t = typeOf($('ajK').value);
  const box = $('ajD');
  if (!box) return;
  if (t.descriptionTemplate) box.value = t.descriptionTemplate;
  else if (!editJobId) box.value = '';
}
function rangesOverlapWorker(uid, start, end, exceptId){
  const tech = techs.find(t => t.uid === uid) || {uid, name:''};
  return jobsForTech(tech).some(j => {
    if (exceptId && j.id === exceptId) return false;
    const s = jobTime(j);
    const e = jobEnd(j, s);
    return rangesOverlap(start, end, s, e);
  });
}
async function saveAssign(){
  const err = $('ajErr');
  if (err) err.textContent = '';
  const bid = $('ajB').value;
  const uid = $('ajT').value;
  const kind = $('ajK').value;
  const start = clockToDate($('ajStart').value, selectedDay);
  const end = clockToDate($('ajEnd').value, selectedDay);
  const addrIn = ($('ajAddr')&&$('ajAddr').value.trim()) || '';
  if (!uid) { if (err) err.textContent = 'Elige un trabajador.'; return; }
  if (!cid()) { if (err) err.textContent = 'No hay compañía activa.'; return; }
  if (!start || !end) { if (err) err.textContent = 'Pon Start time y End time.'; return; }
  if (!(end.getTime() > start.getTime())) { if (err) err.textContent = 'End time must be after Start time.'; return; }
  if (rangesOverlapWorker(uid, start, end, editJobId)) {
    if (!confirm('Este horario se cruza con otro trabajo de la misma persona. ¿Guardar igual?')) return;
  }
  const b = buildings.find(x=>x.id===bid);
  const title = (b && b.name) || addrIn || kind || 'Job';
  const payload = {
    companyId: cid(), buildingId: bid || '', assignedTo: uid, assignedUid: uid,
    title, address: addrIn || title, kind,
    description: ($('ajD')&&$('ajD').value.trim()) || '',
    instructions: ($('ajD')&&$('ajD').value.trim()) || '',
    color: typeOf(kind).color || '#34C759', icon: typeOf(kind).icon || '🔧',
    companyType, status: 'open',
    hour: start.getHours(), minute: start.getMinutes(),
    endHour: end.getHours(), endMinute: end.getMinutes(),
    startClock: toClock(start), endClock: toClock(end),
    scheduledDate: ymd(selectedDay),
    startTime: fmt(start), time: fmt(start), endTime: fmt(end),
    appointment_start: firebase.firestore.Timestamp.fromDate(start),
    appointment_end: firebase.firestore.Timestamp.fromDate(end),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  try {
    if (editJobId) {
      await db.collection('jobs').doc(editJobId).set(payload, {merge:true});
    } else {
      payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      await db.collection('jobs').add(payload);
    }
  } catch(e) {
    if (err) err.textContent = 'No se guardó: ' + (e.message || e);
    return;
  }
  editJobId = '';
  preWorker = '';
  preStartClock = '';
  preEndClock = '';
  $('modal').classList.add('hidden');
  await loadBoard();
}

async function openMoney(){

  $('modal').innerHTML = `<div class="box"><p class="muted">Cargando…</p></div>`;
  const month = ymd(selectedDay).slice(0,7);

  } catch(e){
    $('modal').innerHTML = `<div class="box"><h3>Dinero</h3><p class="err">${esc(e.message||'No se pudo leer')}</p><button class="btn ghost" onclick="$('modal').classList.add('hidden')">Cerrar</button></div>`;
    return;
  }
  const mine = rows.filter(r => String(r.date||'').startsWith(month));
  const earned = mine.filter(r=>r.type==='earned').reduce((s,r)=>s+Number(r.amount||0),0);
  const spent = mine.filter(r=>r.type==='spent').reduce((s,r)=>s+Number(r.amount||0),0);
  const list = mine.sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(r =>
    `<div style="padding:8px 0;border-bottom:1px solid #F2F2F7">${r.type==='earned'?'+':'-'} $${Number(r.amount).toFixed(2)} · ${esc(r.date)}<div class="muted">${esc(r.note||'')}</div></div>`
  ).join('') || '<p class="muted">Sin movimientos este mes.</p>';
  $('modal').innerHTML = `<div class="box">
    <h3>Dinero · ${esc(month)}</h3>
    <p><b>Earned</b> $${earned.toFixed(2)}<br><b>Spent</b> $${spent.toFixed(2)}<br><b>Profit</b> $${(earned-spent).toFixed(2)}</p>
    <label class="muted">Tipo</label>
    <select id="mnT"><option value="earned">Earned</option><option value="spent">Spent</option></select>
    <label class="muted">Monto</label><input id="mnA" type="number" min="0" step="0.01" placeholder="1000">
    <label class="muted">Fecha</label><input id="mnD" type="text" value="${ymd(new Date())}">
    <label class="muted">Nota</label><input id="mnN" type="text" placeholder="Earned $1000 / Spent $500">
    <div class="err" id="mnErr"></div>
    <button class="btn" onclick="saveMoney()">Guardar</button>
    <div style="margin-top:12px">${list}</div>
    <button class="btn ghost" onclick="$('modal').classList.add('hidden')">Cerrar</button>
  </div>`;
}
async function saveMoney(){
  if (!canSeeMoney()) return;
  const err = $('mnErr');
  const type = $('mnT').value;
  const amount = Number($('mnA').value);
  const date = ($('mnD').value||'').trim();
  const note = ($('mnN').value||'').trim();
  if (!(amount>=0) || !date || date.length!==10) { err.textContent = 'Monto y fecha YYYY-MM-DD.'; return; }
  try {
    await db.collection('companies').doc(cid()).collection('ledger').add({
      type, amount, date, note, companyId: cid(),
      createdBy: auth.currentUser.uid,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    openMoney();
  } catch(e) { err.textContent = e.message || 'No se guardó.'; }
}

async function addBuilding(){
  if (!isBoss()) return;
  const name = $('nbName').value.trim();
  const floors = Math.min(100, Math.max(1, parseInt($('nbFloors').value)||1));
  if (!name){ alert('Escribe el nombre del edificio'); return; }
  const ref = db.collection('buildings').doc();
  await ref.set({ id: ref.id, name, floors, companyId: cid(), kind: companyType === 'property_management' ? 'Inspections' : 'Site', companyType });
  try {
    await db.collection('companies').doc(cid()).collection('buildings').doc(ref.id)
      .set({ id: ref.id, name, floors, companyId: cid() });
  } catch(_){}
  $('nbName').value = '';
  loadBoard();
}

function renderMySchedule(){
  $('weekTitle').textContent = 'My Schedule';
  const uid = auth.currentUser && auth.currentUser.uid;
  const name = (profile.displayName || '').toLowerCase();
  const mine = jobs.filter(j => {
    const a = String(assignedOf(j)||'');
    if (selectedBuilding && j.buildingId && j.buildingId !== selectedBuilding) return false;
    return a === uid || a.toLowerCase() === name || a === name;
  });
  let html = `<div class="card"><h2>My Schedule</h2>`;
  if (!mine.length) html += '<p class="muted">No hay visitas asignadas.</p>';
  mine.forEach(j => {
    const addr = j.address || j.title || 'Job';
    const t = j.time || j.startTime || '9 AM';
    html += `<p><b>My ${esc(addr)} — ${esc(t)}</b></p>`;
  });
  html += '</div>';
  $('workerMain').innerHTML = html;
}
async function loadWorkerJobs(){ renderMySchedule(); }

const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function nombreMes(ym){ if(!ym) return ''; const p = String(ym).split('-'); return MESES[parseInt(p[1],10)-1] + ' ' + p[0]; }

async function loadMonths(buildingId){
  $('viewMonths').classList.remove('hidden');
  $('viewDetail').classList.add('hidden');
  const snap = await db.collection('walkthroughs').where('buildingId','==',buildingId).get();
  const list = []; snap.forEach(d => list.push({id:d.id, ...d.data()}));
  const b = buildings.find(x=>x.id===buildingId) || {name:''};
  let html = `<button class="back" onclick="$('viewMonths').classList.add('hidden')">← Schedule</button>
    <div class="card"><h2>${esc(b.name)}</h2>`;
  if (!list.length) html += '<p class="muted">Sin recorridos todavía.</p>';
  list.forEach(w => {
    html += `<p><button class="btn" onclick="alert('${esc(nombreMes(w.yearMonth))} · ${(w.findings||[]).length} hallazgos')">${esc(nombreMes(w.yearMonth))}</button></p>`;
  });
  html += '</div>';
  $('viewMonths').innerHTML = html;
}
</script>
