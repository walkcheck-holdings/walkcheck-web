<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walkcheck · Panel</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="/js/jobTemplates.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; margin: 0; background: #F2F2F7; color: #111; }
  header { background: #34C759; color: #fff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  header h1 { margin: 0; font-size: 18px; font-weight: 800; }
  header h1 a { color: #fff; text-decoration: none; }
  header button { background: rgba(255,255,255,.2); color: #fff; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; min-height: 44px; }
  .muted { color: #8E8E93; font-size: 13px; }
  .err { color: #b3261e; font-size: 14px; margin-top: 8px; }
  .btn { background: #34C759; color: #fff; border: none; padding: 12px 16px; border-radius: 10px; font-size: 14px; cursor: pointer; width: 100%; min-height: 44px; font-weight: 700; }
  .btn.ghost { background: #F0F0F0; color: #111; }
  .btn.ok { font-size: 12px; min-height: 36px; width: auto; padding: 8px 14px; }
  input[type=email], input[type=password], input[type=text], input[type=number], select, textarea {
    width: 100%; padding: 10px 12px; margin: 6px 0 10px; border: 1px solid #D1D1D6; border-radius: 10px; font-size: 14px;
  }
  #login { max-width: 380px; margin: 60px auto; background: #fff; padding: 20px; border-radius: 12px; }
  #board { display: none; height: calc(100vh - 56px); }
  body.ready #board { display: flex; }
  body.ready #login { display: none; }
  #sidebar { width: 300px; min-width: 300px; background: #fff; border-right: 1px solid #E5E5EA; display: flex; flex-direction: column; }
  #sidebar h2 { margin: 0; padding: 14px 14px 6px; font-size: 16px; }
  #bList { overflow: auto; flex: 1; }
  .b-item { padding: 10px 14px; cursor: pointer; font-size: 14px; font-weight: 500; border-bottom: 1px solid #F2F2F7; }
  .b-item:hover, .b-item.on { background: #E8F8EC; }
  .chips { padding: 0 14px 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font-size: 11px; padding: 6px 10px; border-radius: 16px; border: 1px solid #D1D1D6; background: #fff; cursor: pointer; }
  .chip.on { background: #D1F5D8; border-color: #34C759; font-weight: 700; }
  .addbox { padding: 12px 14px; border-top: 1px solid #E5E5EA; }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #staffMain { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .weekbar { background: #fff; padding: 10px 14px 6px; }
  .weekbar h2 { margin: 0 0 8px; font-size: 16px; }
  .weekdays { display: flex; }
  .wd { flex: 1; text-align: center; padding: 6px 0; cursor: pointer; }
  .wd .d { font-size: 11px; color: #8E8E93; }
  .wd.on { border-bottom: 2px solid #34C759; font-weight: 800; color: #34C759; }
  .hours { display: flex; padding-left: 140px; overflow-x: auto; background: #fff; border-bottom: 1px solid #E5E5EA; }
  .hour { min-width: 90px; width: 90px; font-size: 12px; font-weight: 700; color: #6B7280; padding: 8px 0; }
  #rows { overflow: auto; flex: 1; }
  .tech { display: flex; border-bottom: 1px solid #E5E5EA; min-height: 136px; background: #fff; }
  .tech-name { width: 140px; min-width: 140px; padding: 12px; font-size: 13px; font-weight: 800; }
  .tech-name span { display: block; font-weight: 500; color: #8E8E93; font-size: 11px; }
  .lane { position: relative; display: flex; height: 136px; overflow-x: auto; flex: 1; }
  .slot { min-width: 90px; width: 90px; height: 136px; border-left: 1px solid #EEEEEE; }
  .slot.over { background: #E8F8EC; }
  .jcard {
    position: absolute; top: 8px; height: 120px; padding: 16px; border-radius: 12px;
    background: #34C759; color: #fff; font-size: 14px; cursor: grab; z-index: 2;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .jcard b { font-size: 12px; }
  .jcard .t { font-size: 16px; font-weight: 600; }
  .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #8E8E93; font-size: 12px; border-top: 1px dashed #C7C7CC; margin: 60px 16px 0 16px; }
  #assignBar { padding: 10px 14px; background: #fff; border-top: 1px solid #E5E5EA; }
  #adminLink { background: rgba(0,0,0,.18); }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 20; }
  .modal .box { background: #fff; border-radius: 16px; padding: 18px; width: 360px; max-width: 92vw; }
  .hidden { display: none !important; }
  .card { background: #fff; border-radius: 12px; padding: 16px; margin: 12px; }
  .back { background: none; border: none; color: #2E7D32; font-size: 15px; cursor: pointer; }
  @media (max-width: 800px) {
    #board { flex-direction: column; height: auto; }
    #sidebar { width: 100%; min-width: 0; max-height: 40vh; }
  }
</style>
</head>
<body>
<header>
  <h1><a href="/">Walkcheck</a></h1>
  <div style="display:flex;align-items:center;gap:10px">
    <span id="roleChip"></span>
    <a id="adminLink" href="/admin/" class="hidden" style="color:#fff;text-decoration:none;padding:8px 12px;border-radius:8px;font-weight:800;font-size:13px">SUPER ADMIN</a>
    <button id="btnLogout" class="hidden">Cerrar sesión</button>
  </div>
</header>

<div id="login">
  <h3>Entrar a Walkcheck</h3>
  <p class="muted">Team Schedule para todos. El tipo de job sale del oficio de tu compañía. <a href="/register/">Registrar</a></p>
  <input type="email" id="email" placeholder="Correo" autocomplete="username">
  <input type="password" id="password" placeholder="Contraseña" autocomplete="current-password">
  <button class="btn" id="btnLogin">Entrar</button>
  <div class="err" id="loginErr"></div>
</div>

<div id="board">
  <aside id="sidebar">
    <h2 id="sitesTitle">Buildings</h2>
    <div style="padding:0 14px">
      <input type="text" id="bSearch" placeholder="Search buildings...">
    </div>
    <div class="chips">
      <button class="chip on" data-f="All">All</button>
      <button class="chip" data-f="Inspections">Inspections</button>
      <button class="chip" data-f="Maintenance">Maintenance</button>
    </div>
    <div id="bList"></div>
    <div class="addbox" id="addbox">
      <div class="muted" style="font-weight:800;margin-bottom:6px">＋ Nuevo edificio</div>
      <input type="text" id="nbName" placeholder="Nombre del edificio">
      <input type="number" id="nbFloors" value="1" min="1" max="100">
      <button class="btn" onclick="addBuilding()">Agregar</button>
    </div>
  </aside>
  <section id="main">
    <div class="weekbar">
      <div style="display:flex;align-items:center;gap:8px">
        <h2 id="weekTitle">Team Schedule</h2>
        <button class="btn ok" onclick="goToday()">Today</button>
        <button class="btn ok ghost" onclick="alert('Filters: Inspections / Maintenance en la izquierda')">Filters</button>
      </div>
      <div class="weekdays" id="weekdays"></div>
    </div>
    <div id="staffMain">
      <div class="hours" id="hours"></div>
      <div id="rows"></div>
      <div id="assignBar" class="hidden">
        <button class="btn" onclick="openAssign()">+ Assign Job</button>
      </div>
    </div>
    <div id="workerMain" class="hidden" style="overflow:auto;flex:1"></div>
  </section>
</div>

<div id="viewJobs" class="hidden"></div>
<div id="viewMonths" class="hidden" style="padding:16px"></div>
<div id="viewDetail" class="hidden" style="padding:16px"></div>
<div id="modal" class="modal hidden"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAnAsnPirqkN-fRIx-9aQzuwLBoFaHggrU",
  authDomain: "walkcheck-a4f1e.firebaseapp.com",
  projectId: "walkcheck-a4f1e",
  storageBucket: "walkcheck-a4f1e.firebasestorage.app",
  messagingSenderId: "827762473021",
  appId: "1:827762473021:web:ff71afbe72df3a96ad5254"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const $ = id => document.getElementById(id);
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const HOURS = [8,9,10,11,12,13,14,15,16];
const SLOT = 90;
const START = 8;

let profile = { role: 'worker', companyId: '', displayName: '' };
let buildings = [];
let techs = [];
let jobs = [];
let selectedDay = new Date();
let bFilter = 'All';
let bQuery = '';
let selectedBuilding = '';
let companyType = 'property_management';
function pack(){
  const t = window.JOB_TEMPLATES || {};
  return t[companyType] || t.property_management || {sitesLabel:'Buildings', searchPlaceholder:'Search buildings...', jobs:['INSPECTION']};
}

function isSuper(){
  return (auth.currentUser && auth.currentUser.email || '').toLowerCase() === 'maikelramirez55@gmail.com';
}
function isBoss(){
  if (isSuper()) return true;
  return ['owner','admin','manager','supervisor','editor'].includes(String(profile.role||'').toLowerCase());
}
function canAssign(){
  return ['owner','admin','manager','supervisor'].includes(String(profile.role||'').toLowerCase())
    || isSuper();
}
function cid(){ return profile.companyId || (isSuper() ? 'A0PKuVyRMLJ0Bv2UNzb3' : ''); }

$('btnLogin').onclick = async () => {
  $('loginErr').textContent = '';
  try { await auth.signInWithEmailAndPassword($('email').value.trim(), $('password').value); }
  catch(e){ $('loginErr').textContent = 'No se pudo entrar: ' + e.message; }
};
$('btnLogout').onclick = () => auth.signOut();

auth.onAuthStateChanged(async user => {
  document.body.classList.toggle('ready', false);
  $('btnLogout').classList.toggle('hidden', !user);
  $('adminLink').classList.add('hidden');
  $('roleChip').textContent = '';
  $('viewJobs').classList.add('hidden');
  if (!user) return;
  const doc = await db.collection('users').doc(user.uid).get();
  profile = doc.exists ? doc.data() : { role: 'worker', companyId: '' };
  $('adminLink').classList.toggle('hidden', !isSuper());
  $('roleChip').textContent = (isBoss() ? 'Jefe / Admin' : 'Trabajador') + (profile.displayName ? ' · ' + profile.displayName : '');
  document.body.classList.add('ready');
  const staff = isBoss();
  $('addbox').classList.toggle('hidden', !staff);
  $('staffMain').classList.toggle('hidden', !staff);
  $('workerMain').classList.toggle('hidden', staff);
  $('assignBar').classList.toggle('hidden', !canAssign());
  await loadBoard();
  if (!staff) renderMySchedule();
});

$('bSearch').oninput = e => { bQuery = e.target.value; renderBuildings(); };
document.querySelectorAll('.chip').forEach(ch => {
  ch.onclick = () => {
    document.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
    ch.classList.add('on');
    bFilter = ch.dataset.f;
    renderBuildings();
    renderRows();
  };
});

function weekStart(d){
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() - (x.getDay()));
  return x;
}
function sameDay(a,b){
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}
function hLabel(h){ const h12 = h%12===0?12:h%12; return h12 + ' ' + (h<12?'AM':'PM'); }

function renderWeek(){
  const ws = weekStart(selectedDay);
  const end = new Date(ws); end.setDate(end.getDate()+6);
  const meses = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  $('weekTitle').textContent = `Team Schedule — Week of ${meses[ws.getMonth()]} ${ws.getDate()}–${end.getDate()}, ${ws.getFullYear()}`;
  const letters = ['S','M','T','W','T','F','S'];
  let html = '';
  for (let i=0;i<7;i++){
    const d = new Date(ws); d.setDate(ws.getDate()+i);
    html += `<div class="wd ${sameDay(d,selectedDay)?'on':''}" onclick="pickDay(${d.getTime()})"><div class="d">${letters[i]}</div>${d.getDate()}</div>`;
  }
  $('weekdays').innerHTML = html;
  $('hours').innerHTML = HOURS.map(h => `<div class="hour">${hLabel(h)}</div>`).join('');
}
function pickDay(ms){ selectedDay = new Date(ms); loadBoard(); }
function goToday(){ selectedDay = new Date(); loadBoard(); }

async function colGet(pathTry){
  try { return await pathTry; } catch(e){ return null; }
}

async function loadBoard(){
  renderWeek();
  const id = cid();
  try {
    const co = await db.collection('companies').doc(id).get();
    const raw = (co.exists && (co.data().companyType || co.data().industry || co.data().trade)) || 'property_management';
    companyType = String(raw).toLowerCase().replace(/\s+/g,'_');
    if (!(window.JOB_TEMPLATES||{})[companyType]) {
      if (/electric/.test(companyType)) companyType = 'electrical';
      else if (/plumb/.test(companyType)) companyType = 'plumbing';
      else if (/hvac|air/.test(companyType)) companyType = 'hvac';
      else if (/roof/.test(companyType)) companyType = 'roofing';
      else if (/clean/.test(companyType)) companyType = 'cleaning';
      else if (/construct/.test(companyType)) companyType = 'construction';
      else companyType = 'property_management';
    }
  } catch(_) { companyType = 'property_management'; }
  $('sitesTitle').textContent = pack().sitesLabel;
  $('bSearch').placeholder = pack().searchPlaceholder;
  const bDocs = [];
  let s = await colGet(db.collection('buildings').where('companyId','==',id).limit(50).get());
  if (s) s.forEach(d => bDocs.push({id:d.id, ...d.data()}));
  s = await colGet(db.collection('companies').doc(id).collection('buildings').limit(50).get());
  if (s) s.forEach(d => { if (!bDocs.some(x=>x.id===d.id)) bDocs.push({id:d.id, ...d.data()}); });
  bDocs.sort((a,b)=> String(a.name||'').localeCompare(String(b.name||'')));
  buildings = bDocs.slice(0,50);

  const tDocs = [];
  s = await colGet(db.collection('users').where('companyId','==',id).limit(50).get());
  if (s) s.forEach(d => tDocs.push({uid:d.id, name:d.data().displayName||'Tech', role:d.data().role||'worker'}));
  if (!tDocs.length && id === 'A0PKuVyRMLJ0Bv2UNzb3') {
    tDocs.push({uid:'luis', name:'Luis Molina', role:'worker'});
    tDocs.push({uid: auth.currentUser.uid, name: profile.displayName || 'Maikel Ramirez', role:'owner'});
  }
  techs = tDocs;

  const jDocs = [];
  s = await colGet(db.collection('jobs').where('companyId','==',id).limit(50).get());
  if (s) s.forEach(d => jDocs.push({id:d.id, ...d.data()}));
  s = await colGet(db.collection('companies').doc(id).collection('jobs').limit(50).get());
  if (s) s.forEach(d => { if (!jDocs.some(x=>x.id===d.id)) jDocs.push({id:d.id, ...d.data()}); });
  s = await colGet(db.collection('walkthroughs').where('companyId','==',id).limit(50).get());
  if (s) s.forEach(d => jDocs.push({id:d.id, ...d.data(), _wt:true}));
  jobs = jDocs;
  renderBuildings();
  if (isBoss()) renderRows();
  else renderMySchedule();
}

function renderBuildings(){
  const q = bQuery.toLowerCase();
  const list = buildings.filter(b => {
    const kind = String(b.kind||b.type||'Inspections');
    if (bFilter==='Inspections' && /maint/i.test(kind)) return false;
    if (bFilter==='Maintenance' && !/maint/i.test(kind)) return false;
    return !q || String(b.name||'').toLowerCase().includes(q);
  });
  $('bList').innerHTML = list.map(b =>
    `<div class="b-item ${b.id===selectedBuilding?'on':''}" onclick="selectBuilding('${b.id}')">${esc(b.name||b.id)}</div>`
  ).join('') || '<div class="muted" style="padding:14px">Sin edificios</div>';
}
function selectBuilding(id){
  selectedBuilding = id;
  renderBuildings();
  if (isBoss()) loadMonths(id);
  else renderMySchedule();
}

function jobTime(j){
  const t = j.time || j.startTime || j.appointmentStart || j.appointment_start;
  if (t && t.toDate) return t.toDate();
  const d = selectedDay;
  let h=9, m=0;
  const raw = String(t||'').toUpperCase().replace('.',':');
  const num = raw.replace(/[^0-9:]/g,'');
  if (/^\d{1,2}$/.test(num)) h = parseInt(num,10);
  else if (num.includes(':')) { const p=num.split(':'); h=parseInt(p[0],10)||9; m=parseInt(p[1],10)||0; }
  if (raw.includes('PM') && h<12) h+=12;
  return new Date(d.getFullYear(), d.getMonth(), d.getDate(), h, m);
}
function jobEnd(j, start){
  const t = j.endTime || j.appointmentEnd;
  if (!t) return new Date(start.getTime()+60*60*1000);
  const d = jobTime({time:t});
  return d > start ? d : new Date(start.getTime()+45*60*1000);
}
function jobDayOk(j){
  const t = j.appointment_start || j.createdAt;
  if (t && t.toDate) return sameDay(t.toDate(), selectedDay);
  return true;
}
function assignedOf(j){
  return j.assignedTo || j.assignedUid || j.assignedUserId || j.uid || '';
}

function renderRows(){
  $('rows').innerHTML = techs.map(t => {
    const mine = jobs.filter(j => {
      if (!jobDayOk(j)) return false;
      const a = assignedOf(j);
      return a === t.uid || a === t.name || (!a && t.name.toLowerCase().includes('maikel') && jobs.filter(x=>assignedOf(x)===t.uid).length===0 && j === jobs[0]);
    });
    const real = jobs.filter(j => jobDayOk(j) && (assignedOf(j)===t.uid || assignedOf(j)===t.name));
    const list = real;
    const slots = HOURS.map(h => `<div class="slot" data-uid="${t.uid}" data-hour="${h}" ondragover="allowDrop(event)" ondrop="dropJob(event)"></div>`).join('');
    let cards = '';
    list.forEach(j => {
      const st = jobTime(j);
      const en = jobEnd(j, st);
      const left = ((st.getHours()+st.getMinutes()/60)-START)*SLOT;
      const w = Math.max(80, ((en-st)/3600000)*SLOT);
      const addr = j.address || j.title || j.buildingName || 'Job';
      const kind = /semi/i.test(j.kind||j.title||'') ? 'SEMI ANNUAL' : (j.kind || 'INSPECTION');
      const when = fmt(st)+'–'+fmt(en);
      cards += `<div class="jcard" ${isBoss()?'draggable="true" ondragstart="dragJob(event,\''+j.id+'\')"':''} style="left:${left}px;width:${w}px">
        <div>${esc(addr)}</div><b>${esc(kind)}</b><div class="t">${when}</div></div>`;
    });
    const empty = list.length ? '' : `<div class="empty">No jobs scheduled</div>`;
    return `<div class="tech">
      <div class="tech-name">${esc(t.name)}<span>${list.length} jobs</span></div>
      <div class="lane">${slots}${cards}${empty}</div>
    </div>`;
  }).join('');
}
function fmt(d){
  const h = d.getHours()%12===0?12:d.getHours()%12;
  const m = String(d.getMinutes()).padStart(2,'0');
  return h+':'+m+(d.getHours()<12?'AM':'PM');
}

let dragId = '';
function dragJob(ev, id){ dragId = id; ev.dataTransfer.setData('text/plain', id); }
function allowDrop(ev){ ev.preventDefault(); ev.currentTarget.classList.add('over'); }
function dropJob(ev){
  ev.preventDefault();
  ev.currentTarget.classList.remove('over');
  if (!canAssign()) return;
  const hour = parseInt(ev.currentTarget.dataset.hour,10);
  const uid = ev.currentTarget.dataset.uid;
  const id = dragId || ev.dataTransfer.getData('text/plain');
  if (!id) return;
  openMove(id, hour, uid);
}
function openMove(id, hour, uid){
  $('modal').classList.remove('hidden');
  $('modal').innerHTML = `<div class="box">
    <h3>¿Mover trabajo a ${hLabel(hour)}?</h3>
    <p class="muted">Razón</p>
    <button class="btn" onclick="doMove('${id}',${hour},'${uid}','Cliente pidió')">Cliente pidió</button>
    <button class="btn ghost" onclick="doMove('${id}',${hour},'${uid}','Lluvia')">Lluvia</button>
    <button class="btn ghost" onclick="doMove('${id}',${hour},'${uid}','Emergencia')">Emergencia</button>
    <button class="btn ghost" onclick="$('modal').classList.add('hidden')">Cancelar</button>
  </div>`;
}
async function doMove(id, hour, uid, reason){
  const h12 = hour%12===0?12:hour%12;
  const am = hour<12?'AM':'PM';
  const start = new Date(selectedDay.getFullYear(), selectedDay.getMonth(), selectedDay.getDate(), hour);
  const patch = {
    assignedTo: uid, assignedUid: uid,
    startTime: h12+':00 '+am, time: h12+':00 '+am,
    appointment_start: firebase.firestore.Timestamp.fromDate(start),
    moveReason: reason,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  try { await db.collection('jobs').doc(id).set(patch,{merge:true}); } catch(_){}
  try { await db.collection('companies').doc(cid()).collection('jobs').doc(id).set(patch,{merge:true}); } catch(_){}
  $('modal').classList.add('hidden');
  loadBoard();
}

function openAssign(){
  const bopts = buildings.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('');
  const topts = techs.map(t=>`<option value="${t.uid}">${esc(t.name)}</option>`).join('');
  const kopts = pack().jobs.map(k=>`<option>${esc(k)}</option>`).join('');
  $('modal').classList.remove('hidden');
  $('modal').innerHTML = `<div class="box">
    <h3>+ Assign Job</h3>
    <label class="muted">${esc(pack().sitesLabel)}</label><select id="ajB">${bopts}</select>
    <label class="muted">Trabajador</label><select id="ajT">${topts}</select>
    <label class="muted">Tipo</label><select id="ajK">${kopts}</select>
    <label class="muted">Descripción</label><textarea id="ajD" rows="3" placeholder="Qué hay que hacer"></textarea>
    <button class="btn" onclick="saveAssign()">Asignar</button>
    <button class="btn ghost" onclick="$('modal').classList.add('hidden')">Cancelar</button>
  </div>`;
}
async function saveAssign(){
  const bid = $('ajB').value, uid = $('ajT').value, kind = $('ajK').value;
  const b = buildings.find(x=>x.id===bid) || {name:'Job'};
  const payload = {
    companyId: cid(), buildingId: bid, assignedTo: uid, assignedUid: uid,
    title: b.name, address: b.name, kind, description: ($('ajD')&&$('ajD').value.trim()) || '',
    companyType, status: 'open',
    startTime: '9:00 AM', time: '9:00 AM', endTime: '10:00 AM',
    appointment_start: firebase.firestore.Timestamp.fromDate(selectedDay),
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  await db.collection('jobs').add(payload);
  try { await db.collection('companies').doc(cid()).collection('jobs').add(payload); } catch(_){}
  $('modal').classList.add('hidden');
  loadBoard();
}

async function addBuilding(){
  if (!isBoss()) return;
  const name = $('nbName').value.trim();
  const floors = Math.min(100, Math.max(1, parseInt($('nbFloors').value)||1));
  if (!name){ alert('Escribe el nombre del edificio'); return; }
  const ref = db.collection('buildings').doc();
  await ref.set({ id: ref.id, name, floors, companyId: cid(), kind: 'Inspections' });
  try {
    await db.collection('companies').doc(cid()).collection('buildings').doc(ref.id)
      .set({ id: ref.id, name, floors, companyId: cid() });
  } catch(_){}
  $('nbName').value = '';
  loadBoard();
}

function renderMySchedule(){
  $('weekTitle').textContent = 'My Schedule';
  const uid = auth.currentUser && auth.currentUser.uid;
  const name = (profile.displayName || '').toLowerCase();
  const mine = jobs.filter(j => {
    const a = String(assignedOf(j)||'');
    if (selectedBuilding && j.buildingId && j.buildingId !== selectedBuilding) return false;
    return a === uid || a.toLowerCase() === name || a === name;
  });
  let html = `<div class="card"><h2>My Schedule</h2>`;
  if (!mine.length) html += '<p class="muted">No hay visitas asignadas.</p>';
  mine.forEach(j => {
    const addr = j.address || j.title || 'Job';
    const t = j.time || j.startTime || '9 AM';
    html += `<p><b>My ${esc(addr)} — ${esc(t)}</b></p>`;
  });
  html += '</div>';
  $('workerMain').innerHTML = html;
}
async function loadWorkerJobs(){ renderMySchedule(); }

const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function nombreMes(ym){ if(!ym) return ''; const p = String(ym).split('-'); return MESES[parseInt(p[1],10)-1] + ' ' + p[0]; }

async function loadMonths(buildingId){
  $('viewMonths').classList.remove('hidden');
  $('viewDetail').classList.add('hidden');
  const snap = await db.collection('walkthroughs').where('buildingId','==',buildingId).get();
  const list = []; snap.forEach(d => list.push({id:d.id, ...d.data()}));
  const b = buildings.find(x=>x.id===buildingId) || {name:''};
  let html = `<button class="back" onclick="$('viewMonths').classList.add('hidden')">← Schedule</button>
    <div class="card"><h2>${esc(b.name)}</h2>`;
  if (!list.length) html += '<p class="muted">Sin recorridos todavía.</p>';
  list.forEach(w => {
    html += `<p><button class="btn" onclick="alert('${esc(nombreMes(w.yearMonth))} · ${(w.findings||[]).length} hallazgos')">${esc(nombreMes(w.yearMonth))}</button></p>`;
  });
  html += '</div>';
  $('viewMonths').innerHTML = html;
}
</script>
