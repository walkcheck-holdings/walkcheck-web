<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walkcheck</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<script src="/web/compartido/firebase.js"></script>
<script src="/web/entrar.js?v=20261113a"></script>
<style>
html,body{height:100%;margin:0}
body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;color:#0F3A5F;background:#F5F7FA;display:flex;align-items:center;justify-content:center}
.wk-load{display:flex;flex-direction:column;align-items:center;gap:14px;font-weight:700}
.wk-load b{font-size:22px;letter-spacing:.3px;color:#0F3A5F}
.wk-spin{width:38px;height:38px;border:4px solid #D7E3EE;border-top-color:#22A559;border-radius:50%;animation:wkspin .8s linear infinite}
.wk-load span{font-size:15px;color:#4B5563;font-weight:600}
@keyframes wkspin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wk-load" role="status" aria-live="polite"><b>WalkCheck</b><div class="wk-spin"></div><span id="wkLoadTxt">Entrando…</span></div>
<script>try{var l=localStorage.getItem('walkcheck_lang')||localStorage.getItem('wkLang')||((navigator.language||'').slice(0,2)==='en'?'en':'es');if(l==='en')document.getElementById('wkLoadTxt').textContent='Signing in…';}catch(e){}</script>
<script>
auth.onAuthStateChanged(async function (user) {
  if (!user) {
    location.replace('/web/compartido/login.html');
    return;
  }
  var doc = await db.collection('users').doc(user.uid).get();
  if (!WK_hasAccess(user.email, doc)) { WK_denyAccess(); return; }
  var profile = doc.exists ? doc.data() : { role: 'worker' };
  if (await WK_paymentGate(user.email, profile)) return;
  // First sign-in with the company's temporary password → create your own.
  if (profile.mustChangePassword === true) { location.replace('/web/compartido/cambiar-clave.html'); return; }
  location.replace(WK_folderFor(user.email, profile.role));
});
</script>
</body>
</html>
